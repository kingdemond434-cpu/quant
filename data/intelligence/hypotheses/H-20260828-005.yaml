notes: 'ACTIVITY-half card. The clock is the deliverable and it is NOT survivorship-manufactured: survival
  selects which accounts stay visible, it does not invent the hour at which they trade. The PERFORMANCE
  half of the same corpus shows 61.3% of accounts profitable at 15:00 (z~2.4 on 24 hourly tests, i.e.
  NOT significant under Holm, and the accounts are not independent) -- that number is recorded as a pointer
  and is deliberately NOT the basis of this rule.'
