mechanism:
  mechanism_class: flow_absorption
  participant: retail
  constraint: dealer_inventory
  information_source: retail_flow_structure
  why_edge_should_exist: Retail MT5 participation is not uniform across the clock. Measured on 111 mineable
    FX Blue accounts (per-account normalised so no whale sets the clock), trade share peaks at 15:00-17:00
    UTC (7.45/7.23/6.96% of an account's trades per hour vs a 4.17% uniform baseline) -- a ~1.8x concentration
    into the NY/London overlap. The forced counterparty is the dealer absorbing a concentrated, same-direction
    retail flow it must inventory; inventory it cannot lay off is unwound, which is a short-horizon reversal.
  information_propagation: immediate -- the flow and its absorption are contemporaneous
  persistence: unknown; retail clock habits are slow-moving
  kill_conditions:
  - retail participation clock flattens (re-measure the corpus quarterly)
  - the overlap hour stops being the dealer-inventory peak
