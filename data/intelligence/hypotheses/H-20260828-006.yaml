  why_edge_should_exist: 'Trade share spikes to 5.84% at 00:00 broker time -- the single largest hour
    outside the NY overlap and 1.4x the uniform baseline -- while the neighbouring hours (22:00 3.30%,
    01:00 3.25%) sit near baseline. 00:00 server time is the swap boundary: it is where MT5 books the
    financing charge, and where triple swap is booked on Wednesday. The forced counterparty is anyone
    whose position economics change discretely at a known instant -- carry holders rolling to avoid or
    to capture the charge. The desk''s ONLY repeat-survivor mechanism is funding/carry, and L1.47 names
    discrete payments booked as continuous accruals as an expectation error: this is that error''s order-flow
    footprint.'
  information_propagation: scheduled and known to every participant in advance
  persistence: structural -- it is a contract mechanic, not a behaviour
  kill_conditions:
  - broker changes the swap boundary or moves to continuous financing
  - the 00:00 concentration disappears from a re-harvest of the corpus
