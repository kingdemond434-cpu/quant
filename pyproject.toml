[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Solo Python -> MT5 quant platform (Architecture v1.0). Stage 1: core infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Solo Quant" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.4",  # libs/regime (GMM/HMM probabilistic regimes) — a LIVE entrypoint dep
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]
# Independent backtest cross-check (adversarial finding W3.2 — never trust a single bespoke
# engine). Optional: libs/backtest/cross_engine imports these lazily and degrades gracefully.
crosscheck = [
    "vectorbt>=0.26",
    "backtrader>=1.9",
]
# Battle-tested statistics for cointegration/stationarity (stat-arb cards) and GARCH volatility.
# Optional: libs/research/stationarity import-guards these; hand-rolling ADF/GARCH is banned.
stats = [
    "statsmodels>=0.14",
    "arch>=6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["libs", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
    "DTZ", # flake8-datetimez -- naive datetime construction. The desk is timestamp-governed
           # (forward clocks, 8h funding boundaries, freshness SLAs, §33 deferral expiry): a
           # naive/aware mix is either a TypeError or, worse, silently wrong arithmetic.
    # flake8-bandit, HIGH-SIGNAL SUBSET ONLY. Full `S` is 2458 hits dominated by S101 (asserts in
    # tests, pure noise) plus large S310/S603/S607 families that need a dedicated triage pass, not
    # a blanket suppression -- suppressing a rule wholesale is how security linting becomes
    # decorative. These are the ones that flag real, actionable things today:
    "S104", # bind-all-interfaces  (caught both 0.0.0.0 dashboards)
    "S105", "S106", "S107", # hardcoded credentials
    "S108", # insecure /tmp path
    "S301", "S302", # pickle / marshal deserialization
    "S311", # non-crypto RNG where crypto is implied
    "S608", # hardcoded SQL expression
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately construct the things these rules forbid: naive datetimes to prove
# the aware/naive distinction is enforced, non-crypto RNG to prove determinism, a fixed tmp path
# to assert on it. Flagging a test for exercising the hazard it guards is pure noise.
"tests/**" = ["DTZ", "S311", "S108", "S105", "S106"]
# Table/column IDENTIFIERS are module constants and every call site passes a literal (verified
# 2026-07-25); values are always bound with `?`. SQL identifiers cannot be parameterised, so an
# f-string here is the only option, not a shortcut.
"app/dashboard.py" = ["S608"]
"libs/alpha_factory/research_memory.py" = ["S608"]
"libs/autodiscovery/memory.py" = ["S608"]
# Cadence jitter is deliberately non-cryptographic: a fixed 600s beat is detectable at size, and
# unpredictability-to-a-front-runner is the requirement, not cryptographic strength.
"scripts/run_cashcarry_executor.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["libs", "app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "."
files = ["libs", "app", "migrations", "scripts"]
# scripts/ has no __init__.py and is imported both as `scripts.x` (by max_audit's callers) and
# as a bare path; without this mypy resolves the same file under two module names and aborts.
explicit_package_bases = true

# scripts/ enters the type gate 2026-07-25. 162 files including every entry point that touches
# money -- the executor, the dead-man rail, both recorders -- had never been type-checked at all,
# so the strictest gate in the repo was pointed away from the code that actually runs.
#
# It arrives with a MEASURED backlog of 369 errors across 81 files, and bulk-fixing that would
# mean editing the live executor to satisfy a type checker, which is a well-known way to inject
# bugs into working code. So the backlog's dominant codes are relaxed HERE, in one visible block
# with a burn-down owner, rather than sprinkled as inline ignores that nobody ever removes.
#
# What this still catches TODAY in scripts/: undefined names, bad returns, incompatible calls on
# annotated code, and every error class not listed below. What it buys TOMORROW: new scripts are
# born checked, and the list below only ever shrinks. Burn-down tracked as GAP_REGISTER row 52.
[[tool.mypy.overrides]]
# No published stubs, and a sibling script imported by path. Not a typing debt -- a fact.
module = ["psutil", "websockets", "websockets.*", "run_leverage_opt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.*"
disable_error_code = [
    "no-untyped-def",   # 98 -- unannotated defs; annotating is mechanical, do it per-tranche
    "attr-defined",     # 67 -- mostly third-party stubs (pandas/mt5) missing attributes
    "type-arg",         # 62 -- bare dict/list generics
    "arg-type",         #  32
    "index",            #  25
    "no-any-return",    #  19
    "unused-ignore",    #  14
    "assignment",       #  11
    "operator",         #   9
    "no-untyped-call",  #   8
    # Second tranche, measured after the first relaxation took 369 -> 24. Left for a dedicated
    # pass rather than rushed: several sit in the live executor and the testnet runners, and
    # editing those to satisfy a checker in a hurry is exactly how working code acquires bugs.
    "misc", "union-attr", "return-value", "var-annotated", "call-overload", "func-returns-value",
    "dict-item",
]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "pyarrow.*",
    "duckdb.*",
    "scipy.*",
    "statsmodels.*",
    "arch.*",
    "MetaTrader5.*",
    "vectorbt.*",
    "backtrader.*",
    "streamlit.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode lets same-named test files coexist across dirs (tests/features/test_registry.py
# vs tests/factory/test_registry.py) without __init__.py churn or basename collisions.
addopts = "-ra -q --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["libs"]
branch = true
