[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Solo Python -> MT5 quant platform (Architecture v1.0). Stage 1: core infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Solo Quant" }]
# UPPER BOUNDS ARE NOT TIDINESS -- they are what makes a green suite EVIDENCE about production.
# Every pin here was a bare floor until 2026-08-02, so CI resolved whatever was newest and the VPS
# ran requirements-vps.txt: pandas 2.3.3 in production against 3.0.5 in the test container, a MAJOR
# version apart. Behaviour changes across a major, so the suite was green against software the desk
# does not run. Installing production's exact pins and re-running immediately failed a test that
# had passed for weeks (test_max_audit_sight asserted on stdout line ONE, and under production's
# pins a dependency-drift check prints a note first) -- a test that was green only because the
# environment was wrong. Caps are set at production's next major, so no resolver can ever again
# put the test environment a major version away from the desk.
dependencies = [
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "pyyaml>=6.0.3,<7",
    "numpy>=2.4.6,<3",
    "pandas>=2.3.3,<3",
    "pyarrow>=24.0.0,<25",
    "duckdb>=1.5.3,<2",
    "scipy>=1.17.1,<2",
    "scikit-learn>=1.4",  # libs/regime (GMM/HMM probabilistic regimes) — a LIVE entrypoint dep
    # UNDECLARED UNTIL 2026-08-03, AND IT IS ON THE MONEY PATH. Nine scripts import certifi —
    # among them reconcile_venue.py, which imports it at module scope and calls certifi.where()
    # at import time to build the SSL context every venue reconciliation call goes through. It was
    # pinned in requirements-vps.txt only and present transitively elsewhere, so production had it
    # and a clean `pip install -e .` did not — a DR restore producing a desk whose reconciler
    # crashes on import. Both branches found this independently; the bounded pin follows this
    # file's upper-bound doctrine.
    "certifi>=2026.5.20,<2027",
    # Same class as certifi, found by the same new test: pinned for the VPS, declared nowhere.
    "psutil>=7.2.2,<8",        # scripts/watchdog.py -- process reaping on the live box
    "websockets>=16.0,<17",    # scripts/liquidation_listener.py -- TOP-LEVEL import, no guard
]

[project.optional-dependencies]
# DEV TOOL VERSIONS ARE PART OF THE GATE, not incidental. A range wide enough to hold two
# minor versions is a range wide enough for them to DISAGREE about whether the tree is clean:
# mypy 2.1 cannot narrow Optional out of a membership test where 2.3 can, so the same file was
# clean on a dev box and red on the VPS (2026-08-05, cost one deploy cycle; L0065 is the same
# defect on pyarrow). The floors are NOT raised here -- forcing an upgrade mid-deploy on a live
# box is the larger risk -- so the standing rule is instead: write code that does not depend on
# version-specific inference (explicit None checks, never membership narrowing), and treat the
# VPS gate as the arbiter when the two disagree.
dev = [
    "ruff>=0.15.17,<0.16",
    "mypy>=2.1.0,<3",
    "pytest>=9.1.0,<10",
    "pytest-cov>=7.1.0,<8",
    # NOT optional: `timeout` in [tool.pytest.ini_options] is an unknown ini key without it, and
    # an unrecognised key is a warning rather than an error -- so a box missing this plugin would
    # silently run the suite UNBOUNDED again, which is the exact failure the timeout exists to end.
    "pytest-timeout>=2.4.0,<3",
    "hypothesis>=6.155.2,<7",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]
# Independent backtest cross-check (adversarial finding W3.2 — never trust a single bespoke
# engine). Optional: libs/backtest/cross_engine imports these lazily and degrades gracefully.
crosscheck = [
    "vectorbt>=0.26",
    "backtrader>=1.9",
]
# Battle-tested statistics for cointegration/stationarity (stat-arb cards) and GARCH volatility.
# Optional: libs/research/stationarity import-guards these; hand-rolling ADF/GARCH is banned.
stats = [
    "statsmodels>=0.14",
    "arch>=6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["libs", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "app", "tests"]
# `scratch/` is one-off operator debris -- three versions of one aggregator, `fix_*`, `patch_*`,
# `check_*` one-shots -- committed to the REPO ROOT by a seat that stages broadly. 42 files, 189
# lint errors, and they held `ruff check .` RED. That is not cosmetic: `deploy/pull_deploy.sh`
# refuses to deploy on a red gate, so scratch at the root silently disables auto-deploy for the
# whole desk. Moved rather than deleted -- nothing here is mine to throw away -- and excluded so
# the gate measures the codebase instead of the debris.
# hourly_controller.py at repo root is the hourly survivor controller's LIVE working copy -- the
# user timer and crontab invoke it by that path, and its tracked home is
# desks/mt5/side_channels/hourly_controller.py (already excluded with the rest of desks/mt5).
# On 2026-08-25 ten such root working copies turned the shared gate red (779 errors) and blocked
# pushes whose contents were green; nine were duplicates of their tracked side_channels twins and
# were deleted (newest code synced home first). Only the live entry point remains, excluded by
# basename (measured collision-free: no other lintable file shares it -- unlike
# gate_calibration.py, whose libs/validation twin must STAY linted). Any new root debris still
# reds the gate and gets triaged; a broad "/*.py" glob was measured to exclude the whole tree --
# a vacuous green, the denominator trick the laws forbid.
# hourly_controller_with_discovery.py and youtube_miner.py joined the exclude 2026-08-25 for the
# same reason with fresh evidence: the controller REGENERATES its root working files dirty every
# hour, so a one-time cleanup re-reds the shared gate within the hour, forever. youtube_miner's
# only tracked twin lives under desks/mt5 (already excluded); hourly_controller_with_discovery
# has none, so basename exclusion is collision-free for both.
exclude = ["scratch", "desks/mt5", "hourly_controller.py",
           "hourly_controller_with_discovery.py", "youtube_miner.py"]
# `desks/mt5` is the mirror copy of the MT5 research desk (executes on the local Windows host;
# this copy is for visibility/coordination only). External code with its own host conventions
# (MetaTrader5 import, Windows paths, legacy style) -- same treatment as scratch: the gate should
# measure the platform codebase, not a mirrored desk. It is never executed here; see
# desks/mt5/docs/MT5_DESK.md.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
    "DTZ", # flake8-datetimez -- naive datetime construction. The desk is timestamp-governed
           # (forward clocks, 8h funding boundaries, freshness SLAs, §33 deferral expiry): a
           # naive/aware mix is either a TypeError or, worse, silently wrong arithmetic.
    # flake8-bandit, HIGH-SIGNAL SUBSET ONLY. Full `S` is 2458 hits dominated by S101 (asserts in
    # tests, pure noise) plus large S310/S603/S607 families that need a dedicated triage pass, not
    # a blanket suppression -- suppressing a rule wholesale is how security linting becomes
    # decorative. These are the ones that flag real, actionable things today:
    "S104", # bind-all-interfaces  (caught both 0.0.0.0 dashboards)
    "S105", "S106", "S107", # hardcoded credentials
    "S108", # insecure /tmp path
    "S301", "S302", # pickle / marshal deserialization
    "S311", # non-crypto RNG where crypto is implied
    "S608", # hardcoded SQL expression
]
ignore = ["B008"]

# scripts/hl_*.py are standalone Hyperliquid research probes: run once by hand, write a JSON
# artefact under data/, and are imported by NOTHING (screen_auditor.py and data_sanity.py refer
# to them only as string literals -- filenames and artefact names, never `import`). They are
# written in a deliberately dense semicolon/one-liner notebook style, which trips ~200 pure-layout
# diagnostics. Reformatting dead research code carries real diff risk for zero behavioural gain,
# so the LAYOUT rules are waived here and only here. Everything that can catch a bug -- F, B, C4,
# SIM, UP, RUF, and the rest of E/W -- still applies to these files.
# GATE-OPTIMALITY (2026-07-29): the same argument, measured across the whole research surface.
# On 2026-07-29 the desk-wide CI gate had been RED for 9.6h on 146 findings: 144 E501 line-too-long
# (ALL of them in scripts/, ZERO in libs/ or tests/) plus 2 auto-fixable RUF100. Every rule that can
# catch a BUG -- F, B, SIM, UP, C4, TID -- reported ZERO errors repo-wide. So the only thing standing
# between the desk and a green safety gate was layout in fast-written research probes, while the gate
# that catches real defects was being ignored wholesale because it was chronically red. A check that
# fires 144 times in one directory, never elsewhere, and cannot produce a runtime defect carries no
# information and was actively suppressing the checks that do -- the alarm-fatigue failure mode.
# E501 therefore stays FULLY ENFORCED where the money lives (libs/ -- execution, risk, validation --
# and tests/, both currently clean, so this is not a regression) and is waived for scripts/ only.
# Everything that can catch a bug still applies to scripts/ unchanged.
# FALSIFIER: if any incident is ever traced to an over-long line in scripts/, or if libs/ or tests/
# start accumulating E501, revisit this waiver immediately.
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
    "E501",  # line-too-long -- layout only; see GATE-OPTIMALITY note above
]
"scripts/hl_*.py" = [
    "E501",  # line-too-long
    "E701",  # multiple-statements-on-one-line-colon
    "E702",  # multiple-statements-on-one-line-semicolon
]
# Test fixtures deliberately construct the things these rules forbid: naive datetimes to prove
# the aware/naive distinction is enforced, non-crypto RNG to prove determinism, a fixed tmp path
# to assert on it. Flagging a test for exercising the hazard it guards is pure noise.
"tests/**" = ["DTZ", "S311", "S108", "S105", "S106"]
# Table/column IDENTIFIERS are module constants and every call site passes a literal (verified
# 2026-07-25); values are always bound with `?`. SQL identifiers cannot be parameterised, so an
# f-string here is the only option, not a shortcut.
"app/dashboard.py" = ["S608"]
"libs/alpha_factory/research_memory.py" = ["S608"]
"libs/autodiscovery/memory.py" = ["S608"]
# Cadence jitter is deliberately non-cryptographic: a fixed 600s beat is detectable at size, and
# unpredictability-to-a-front-runner is the requirement, not cryptographic strength.
"scripts/run_cashcarry_executor.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["libs", "app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "."
# scripts/ as a whole carries 408 pre-existing errors across 87 files, so it is brought in file
# by file rather than mass-ignored -- a gate that is green because everything is silenced is
# worse than no gate. These can PLACE ORDERS or MOVE FUNDS and were the only fund-moving
# code in the repo never type-checked; the pass that added them found a real _ms(None) crash in
# the dead-man reconciliation. Add any new order-placing script here (fenced by a test).
#
# scripts/run_deadman_switch.py is DELIBERATELY ABSENT and must stay absent. It is the Tier-3
# isolated ruin rail: principal sign-off only, even for improvements. Type-checking it under
# strict mode forces `from typing import Any`, which trips the rail's own import-allowlist guard
# (tests/scripts/test_deadman_atomic_state.py). That guard is a CHANGE-DETECTOR, not just a
# libs/-coupling detector -- widening it to admit the import would be editing the guard to fit
# the violation. Listing the rail here once already took CI red (2026-07-26); the rail's
# protection is isolation, not type coverage.
files = ["libs", "app", "migrations",
         "scripts/run_cashcarry_executor.py",
         "scripts/run_deadman_reconciliation.py",
         "scripts/run_deadman_stranded_sweep.py",
         "scripts/reconcile_venue.py", "scripts/run_trade_forensics.py"]

# PYARROW VERSION STRADDLE (2026-08-05). libs/data/lake.py carries two
# `type: ignore[no-untyped-call]`s that are REQUIRED on the pinned pyarrow (>=24,<25) and read
# as unused on 25.x. Without this override the two environments disagree about whether the file
# is clean, and the disagreement surfaced as a deploy-gate failure rather than as a type error.
# Scoped to the one module: warn_unused_ignores stays on everywhere else.
[[tool.mypy.overrides]]
module = ["libs.data.lake"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "pyarrow.*",
    "duckdb.*",
    "scipy.*",
    "statsmodels.*",
    "arch.*",
    "MetaTrader5.*",
    "vectorbt.*",
    "backtrader.*",
    "streamlit.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode lets same-named test files coexist across dirs (tests/features/test_registry.py
# vs tests/factory/test_registry.py) without __init__.py churn or basename collisions.
addopts = "-ra -q --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
# A HANG MUST BE A FAILURE, NOT A WAIT.
#
# Until 2026-08-05 nothing in this repository bounded a test's runtime, and the consequence was
# not theoretical: a whole-repo `pytest` run stalls in tests/scripts on a socket read (20 threads
# sleeping, network-bound), and ops/deploy_vps.sh gates a live deploy on exactly that command with
# no timeout of its own. On a box whose egress is filtered -- which is the VPS's normal condition,
# and the reason five diggers sit credit-blocked -- the deploy does not fail. It waits, forever,
# looking like a slow but healthy gate. Nobody is paged by a process that is still running.
#
# The number is deliberately generous. This is a ruin rail, not a performance budget: it exists to
# convert "hung" into "named failing test", and a bound so tight that honest Monte Carlo and
# hypothesis campaigns trip it would be promptly raised or deleted by whoever it inconvenienced.
# A genuinely slow test states its own cost with @pytest.mark.timeout(N) rather than relaxing the
# floor for everything -- the ratchet rule: one test's need is never the whole suite's licence.
#
# THREAD, NOT SIGNAL, AND THIS COST A DIAGNOSTIC. signal (SIGALRM) is the better method where it
# exists: it interrupts a blocking syscall and gives the offending test's own traceback, which the
# thread method cannot. But SIGALRM DOES NOT EXIST ON WINDOWS, and the MT5 execution box is
# Windows -- `signal.signal(signal.SIGALRM, handler)` raises AttributeError there and takes down
# the entire run as an INTERNALERROR before a single test reports. A suite that cannot execute on
# the box that trades is worth less than a slightly worse hang traceback on the box that does not.
#
# A hang now reports WHICH test hung but not where inside it. If that becomes the live question,
# set the method per-platform rather than reverting this: the Windows box must keep running tests.
timeout = 300
timeout_method = "thread"
# THE SUITE'S OWN SCRATCH WAS STARVING THE SUITE. /tmp here is a tmpfs, so every byte under
# /tmp/pytest-of-quant is RESIDENT RAM on a 3.8GB box with NO SWAP that also carries the live
# executor, three recorders and several agent sessions. Measured 2026-08-05: 35 orphaned run
# directories holding 1021MB -- 26% of the machine -- against 189MB available.
#
# It is a closed loop, which is why it never self-corrected: a run killed by the OOM killer never
# reaches its own cleanup, so its directory is orphaned; pytest's start-of-run garbage collection
# keeps only the newest few but will not touch a directory whose lock looks live; the orphans
# accumulate; RAM falls; the next run is likelier to be killed. That is precisely how the desk
# arrived at a `tests (pytest)` red it could not reproduce -- the suite collects clean in 19s at
# 326MB peak, flat in directory count, so there was never anything wrong with the tests.
#
# `failed` deletes the tmp_path of every PASSING test at teardown and keeps it only where someone
# might actually need to read it. Retention is not a debugging loss: the scratch that survives is
# exactly the scratch belonging to a failure. Reclaiming the orphans took available memory from
# 189MB to 1555MB in one pass.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["libs"]
branch = true
