[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Solo Python -> MT5 quant platform (Architecture v1.0). Stage 1: core infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Solo Quant" }]
# UPPER BOUNDS ARE NOT TIDINESS -- they are what makes a green suite EVIDENCE about production.
# Every pin here was a bare floor until 2026-08-02, so CI resolved whatever was newest and the VPS
# ran requirements-vps.txt: pandas 2.3.3 in production against 3.0.5 in the test container, a MAJOR
# version apart. Behaviour changes across a major, so the suite was green against software the desk
# does not run. Installing production's exact pins and re-running immediately failed a test that
# had passed for weeks (test_max_audit_sight asserted on stdout line ONE, and under production's
# pins a dependency-drift check prints a note first) -- a test that was green only because the
# environment was wrong. Caps are set at production's next major, so no resolver can ever again
# put the test environment a major version away from the desk.
dependencies = [
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "pyyaml>=6.0.3,<7",
    "numpy>=2.4.6,<3",
    "pandas>=2.3.3,<3",
    "pyarrow>=24.0.0,<25",
    "duckdb>=1.5.3,<2",
    "scipy>=1.17.1,<2",
    "scikit-learn>=1.4",  # libs/regime (GMM/HMM probabilistic regimes) — a LIVE entrypoint dep
    # UNDECLARED UNTIL 2026-08-03, AND IT IS ON THE MONEY PATH. Nine scripts import certifi —
    # among them reconcile_venue.py, which builds the SSL context every venue reconciliation call
    # goes through. It was pinned in requirements-vps.txt only, so production had it and any
    # install of the declared package did not: `pip install -e .` produced a checkout whose
    # reconciliation script raised ImportError at line 26. It stayed invisible because CI's lint
    # step failed first and skipped the type check that names it.
    "certifi>=2026.5.20,<2027",
    # Same class as certifi, found by the same new test: pinned for the VPS, declared nowhere.
    "psutil>=7.2.2,<8",        # scripts/watchdog.py -- process reaping on the live box
    "websockets>=16.0,<17",    # scripts/liquidation_listener.py -- TOP-LEVEL import, no guard
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.17,<0.16",
    "mypy>=2.1.0,<3",
    "pytest>=9.1.0,<10",
    "pytest-cov>=7.1.0,<8",
    "hypothesis>=6.155.2,<7",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]
# Independent backtest cross-check (adversarial finding W3.2 — never trust a single bespoke
# engine). Optional: libs/backtest/cross_engine imports these lazily and degrades gracefully.
crosscheck = [
    "vectorbt>=0.26",
    "backtrader>=1.9",
]
# Battle-tested statistics for cointegration/stationarity (stat-arb cards) and GARCH volatility.
# Optional: libs/research/stationarity import-guards these; hand-rolling ADF/GARCH is banned.
stats = [
    "statsmodels>=0.14",
    "arch>=6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["libs", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["libs", "app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "."
# scripts/ as a whole carries 408 pre-existing errors across 87 files, so it is brought in file
# by file rather than mass-ignored -- a gate that is green because everything is silenced is
# worse than no gate. These can PLACE ORDERS or MOVE FUNDS and were the only fund-moving
# code in the repo never type-checked; the pass that added them found a real _ms(None) crash in
# the dead-man reconciliation. Add any new order-placing script here (fenced by a test).
#
# scripts/run_deadman_switch.py is DELIBERATELY ABSENT and must stay absent. It is the Tier-3
# isolated ruin rail: principal sign-off only, even for improvements. Type-checking it under
# strict mode forces `from typing import Any`, which trips the rail's own import-allowlist guard
# (tests/scripts/test_deadman_atomic_state.py). That guard is a CHANGE-DETECTOR, not just a
# libs/-coupling detector -- widening it to admit the import would be editing the guard to fit
# the violation. Listing the rail here once already took CI red (2026-07-26); the rail's
# protection is isolation, not type coverage.
files = ["libs", "app", "migrations",
         "scripts/run_cashcarry_executor.py",
         "scripts/run_deadman_reconciliation.py",
         "scripts/run_deadman_stranded_sweep.py",
         "scripts/reconcile_venue.py", "scripts/run_trade_forensics.py"]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "pyarrow.*",
    "duckdb.*",
    "scipy.*",
    "statsmodels.*",
    "arch.*",
    "MetaTrader5.*",
    "vectorbt.*",
    "backtrader.*",
    "streamlit.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode lets same-named test files coexist across dirs (tests/features/test_registry.py
# vs tests/factory/test_registry.py) without __init__.py churn or basename collisions.
addopts = "-ra -q --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["libs"]
branch = true
