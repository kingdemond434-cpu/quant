[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Solo Python -> MT5 quant platform (Architecture v1.0). Stage 1: core infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Solo Quant" }]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "duckdb>=1.5.3",
    "scipy>=1.17.1",
    "scikit-learn>=1.4",  # libs/regime (GMM/HMM probabilistic regimes) — a LIVE entrypoint dep
    # scripts/reconcile_venue.py imports certifi at module scope and calls certifi.where() at
    # import time to build its SSL context, so the venue reconciler cannot even be imported
    # without it. It was undeclared and merely present transitively, which meant it worked on
    # every machine that had already pulled it in for some other reason and would have been
    # absent from a clean `pip install -e .` — a DR restore producing a desk whose reconciler
    # crashes on import. CI, which installs exactly what is declared, is where that surfaced.
    "certifi>=2024.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.2",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]
# Independent backtest cross-check (adversarial finding W3.2 — never trust a single bespoke
# engine). Optional: libs/backtest/cross_engine imports these lazily and degrades gracefully.
crosscheck = [
    "vectorbt>=0.26",
    "backtrader>=1.9",
]
# Battle-tested statistics for cointegration/stationarity (stat-arb cards) and GARCH volatility.
# Optional: libs/research/stationarity import-guards these; hand-rolling ADF/GARCH is banned.
stats = [
    "statsmodels>=0.14",
    "arch>=6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["libs", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
    "DTZ", # flake8-datetimez -- naive datetime construction. The desk is timestamp-governed
           # (forward clocks, 8h funding boundaries, freshness SLAs, §33 deferral expiry): a
           # naive/aware mix is either a TypeError or, worse, silently wrong arithmetic.
    # flake8-bandit, HIGH-SIGNAL SUBSET ONLY. Full `S` is 2458 hits dominated by S101 (asserts in
    # tests, pure noise) plus large S310/S603/S607 families that need a dedicated triage pass, not
    # a blanket suppression -- suppressing a rule wholesale is how security linting becomes
    # decorative. These are the ones that flag real, actionable things today:
    "S104", # bind-all-interfaces  (caught both 0.0.0.0 dashboards)
    "S105", "S106", "S107", # hardcoded credentials
    "S108", # insecure /tmp path
    "S301", "S302", # pickle / marshal deserialization
    "S311", # non-crypto RNG where crypto is implied
    "S608", # hardcoded SQL expression
]
ignore = ["B008"]

# scripts/hl_*.py are standalone Hyperliquid research probes: run once by hand, write a JSON
# artefact under data/, and are imported by NOTHING (screen_auditor.py and data_sanity.py refer
# to them only as string literals -- filenames and artefact names, never `import`). They are
# written in a deliberately dense semicolon/one-liner notebook style, which trips ~200 pure-layout
# diagnostics. Reformatting dead research code carries real diff risk for zero behavioural gain,
# so the LAYOUT rules are waived here and only here. Everything that can catch a bug -- F, B, C4,
# SIM, UP, RUF, and the rest of E/W -- still applies to these files.
# GATE-OPTIMALITY (2026-07-29): the same argument, measured across the whole research surface.
# On 2026-07-29 the desk-wide CI gate had been RED for 9.6h on 146 findings: 144 E501 line-too-long
# (ALL of them in scripts/, ZERO in libs/ or tests/) plus 2 auto-fixable RUF100. Every rule that can
# catch a BUG -- F, B, SIM, UP, C4, TID -- reported ZERO errors repo-wide. So the only thing standing
# between the desk and a green safety gate was layout in fast-written research probes, while the gate
# that catches real defects was being ignored wholesale because it was chronically red. A check that
# fires 144 times in one directory, never elsewhere, and cannot produce a runtime defect carries no
# information and was actively suppressing the checks that do -- the alarm-fatigue failure mode.
# E501 therefore stays FULLY ENFORCED where the money lives (libs/ -- execution, risk, validation --
# and tests/, both currently clean, so this is not a regression) and is waived for scripts/ only.
# Everything that can catch a bug still applies to scripts/ unchanged.
# FALSIFIER: if any incident is ever traced to an over-long line in scripts/, or if libs/ or tests/
# start accumulating E501, revisit this waiver immediately.
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
    "E501",  # line-too-long -- layout only; see GATE-OPTIMALITY note above
]
"scripts/hl_*.py" = [
    "E501",  # line-too-long
    "E701",  # multiple-statements-on-one-line-colon
    "E702",  # multiple-statements-on-one-line-semicolon
]
# Test fixtures deliberately construct the things these rules forbid: naive datetimes to prove
# the aware/naive distinction is enforced, non-crypto RNG to prove determinism, a fixed tmp path
# to assert on it. Flagging a test for exercising the hazard it guards is pure noise.
"tests/**" = ["DTZ", "S311", "S108", "S105", "S106"]
# Table/column IDENTIFIERS are module constants and every call site passes a literal (verified
# 2026-07-25); values are always bound with `?`. SQL identifiers cannot be parameterised, so an
# f-string here is the only option, not a shortcut.
"app/dashboard.py" = ["S608"]
"libs/alpha_factory/research_memory.py" = ["S608"]
"libs/autodiscovery/memory.py" = ["S608"]
# Cadence jitter is deliberately non-cryptographic: a fixed 600s beat is detectable at size, and
# unpredictability-to-a-front-runner is the requirement, not cryptographic strength.
"scripts/run_cashcarry_executor.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["libs", "app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "."
# scripts/ as a whole carries 408 pre-existing errors across 87 files, so it is brought in file
# by file rather than mass-ignored -- a gate that is green because everything is silenced is
# worse than no gate. These can PLACE ORDERS or MOVE FUNDS and were the only fund-moving
# code in the repo never type-checked; the pass that added them found a real _ms(None) crash in
# the dead-man reconciliation. Add any new order-placing script here (fenced by a test).
#
# scripts/run_deadman_switch.py is DELIBERATELY ABSENT and must stay absent. It is the Tier-3
# isolated ruin rail: principal sign-off only, even for improvements. Type-checking it under
# strict mode forces `from typing import Any`, which trips the rail's own import-allowlist guard
# (tests/scripts/test_deadman_atomic_state.py). That guard is a CHANGE-DETECTOR, not just a
# libs/-coupling detector -- widening it to admit the import would be editing the guard to fit
# the violation. Listing the rail here once already took CI red (2026-07-26); the rail's
# protection is isolation, not type coverage.
files = ["libs", "app", "migrations",
         "scripts/run_cashcarry_executor.py",
         "scripts/run_deadman_reconciliation.py",
         "scripts/run_deadman_stranded_sweep.py",
         "scripts/reconcile_venue.py", "scripts/run_trade_forensics.py"]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "pyarrow.*",
    "duckdb.*",
    "scipy.*",
    "statsmodels.*",
    "arch.*",
    "MetaTrader5.*",
    "vectorbt.*",
    "backtrader.*",
    "streamlit.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode lets same-named test files coexist across dirs (tests/features/test_registry.py
# vs tests/factory/test_registry.py) without __init__.py churn or basename collisions.
addopts = "-ra -q --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["libs"]
branch = true
