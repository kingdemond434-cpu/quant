# EliteQuant map (github.com/EliteQuant/EliteQuant, Apache-2.0), absorbed 2026-09-30.
#
# Every blog, forum, code repository and free data source the list links that no roster held.
# Read by libs/mining/acquirer.load_roster through its `desks/mt5/data/source_rosters/*.yaml`
# glob (#133); an id already defined elsewhere keeps its first definition. Dead links on the list
# (IEX market data, Quandl WIKI, Quantopian, cryptrader, KloudTrader) and paid-only feeds (OneTick,
# IQFeed, QuantQuote, AlgoSeek, Intrinio, Bloomberg) are not rostered: the gap table in
# /mnt/project-files/reports/elitequant_mining_2026-09-30.md says why for each.
# Feeds were not reachable from the cloud container (proxy); the box's acquirer is the judge of
# liveness and records UNREACHED per source.
