# Paid-dataset substitutes (RavenPack / card-spend / foot-traffic / satellite panels),
# built by the asia_gap_thread in desks/mt5/research/alt_proxies.py, which FETCHES
# every row itself (fetcher: owned). Generated from alt_proxies.substitute_roster_rows();
# regenerate rather than hand-edit. Live yield is UNMEASURED except where the status
# says otherwise.
sources:
- id: gdelt_events_country
  name: 'GDELT 2.0 Events: country x day x theme tone panel'
  url: http://data.gdeltproject.org/gdeltv2/{slot}.export.CSV.zip
  region: GLOBAL
  language: multi
  cadence: daily
  auth: none
  licence: GDELT Project open data (unrestricted use with citation); no key
  cursor: fwd/back 15-minute slot cursors (12+12 slots/pass, 730d deep); open days held in state.acc
  pit: available_time = page publication stamp else release-calendar rule (late-biased); first_seen_at
    = vault fetch instant
  uses:
  - direct_cells
  - indirect_cells
  - allocation_intel
  consumer: desks/mt5/research/alt_proxies.py
  status: UNMEASURED_LIVE_YIELD
  terms: confirmed
  source_culture: GLOBAL/multi
  participant_structure:
  - institutional
  - retail_heavy
  - policy_driven
  failure_mode_hypothesis: fails when a single mega-story (a war, an election) dominates every country's
    coverage, and when GDELT's source list or translation pipeline changes, which moves tone for no reason
    in the markets
  crowding_prior: medium
  substitutes_for: RavenPack-style news analytics (event counts, tone, themes per entity)
  mechanism: 'machine-coded events from the world''s broadcast, print and web news in 100+ languages,
    every 15 minutes: the article-weighted tone and conflict share of what is happening IN a country is
    the news-flow state a RavenPack sentiment feed sells, computed from the same kind of text'
  payer: holders of EM and Asian FX/index risk who reprice on the headline they read, not on the day's
    aggregate flow of local-language coverage
  constraint: a desk reads a handful of English wires; GDELT's translated local press is too large to
    read, so its aggregate state is not in the price by hand
  fetcher: owned
  owner: asia_gap_thread
  cadence_minutes: 1440
  kind: mechanics
