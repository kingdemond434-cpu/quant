# INSTITUTIONAL FOOTPRINT ATLAS -- one canonical id per public dataset, every jurisdiction.
#
# Principal 2026-09-30 17:47-18:14Z. Ontology: desks/mt5/research/countries/institutional/ontology.py.
# Engine: desks/mt5/research/institutional_footprint.py (hourly leg `institutional_footprint`).
# The unified mining registry (#133, libs/mining/acquirer.load_roster) reads this file in place
# through its `desks/mt5/data/source_rosters/*.yaml` glob; `fetcher: owned` means the engine
# fetches and consumes the row and the registry never fetches it twice.
#
#   id                 institutional.<jurisdiction>.<publisher>.<dataset>, or the id another lane already
#                      registered for the SAME dataset (then `atlas_id` keeps the atlas name and
#                      `aliases` lists every other lane id for it): one canonical id per dataset
#   pit_grade          FIRST_RELEASE (what was published is what is stored) or LATEST_REVISED (a
#                      revisable series at its latest vintage: UNMEASURED for anything point-in-time)
#   declared_status    what a human or scout established: DISCOVERED_NOT_INGESTED, PAID_PUBLIC_PROXY,
#                      BLOCKED_SUBSTITUTE, NOT_PUBLISHED, WATCH (a future regime the watcher probes),
#                      ACTIVE_CANDIDATE (a fetch recipe or an existing lane feeds it). ACTIVE is never
#                      declared: the engine MEASURES it (a lake frame on disk AND cells enqueued).
#   features           the engine features this row feeds (ontology.LATENT_STATES evidence keys)
#   fetch              a recipe the engine knows how to run; rows without one wait for a scout
#   culture fields     source_culture / participant_structure / failure_mode_hypothesis / crowding_prior
#                      (the #139 cell culture schema), stamped on every cell the row produces
#
# Public, lawful, free data only. No crypto venue is ever a source; public chains are a sensor.
