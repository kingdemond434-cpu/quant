# CN-culture data pipelines mined 2026-10-01: dkl0707/QuantDatabase (TuShare + Shenwan) and the data layer of
# ZhuLinsen/daily_stock_analysis (Tencent, TWSE/TPEx 三大法人). Deduped against AkShare (adapter calls only
# stock_zh_a_hist, futures_main_sina, macro_china_cpi), TuShare (licensed free key) and fushare_cn_futures.yaml.
# QuantBox/QuantBox.DataReceiver is a C# CTP tick receiver: it needs a CN futures broker account, so it adds no
# source (its h5 tick-archive layout is noted in the gap table). Shapers: Breadth.
sources:
- id: qdb_sws_industry_index
  name: Shenwan (申万) industry indices, daily OHLC for every SW level-1/2 industry (swsresearch index_publish/trend
    API)
  priority: 1
  kind: mechanics
  uses:
  - direct_cells
  - indirect_cells
  - allocation_intel
  fetcher: json_api
  auth: none
  cadence_minutes: 1440
  region: cn
  language: zh
  licence: public endpoint; terms confirmed by the owner thread before fetch (terms gate fails closed);
    this container's network policy refuses the host, so the check runs on the box
  terms_status: BLOCKED_ON_TERMS
  config:
    url: https://www.swsresearch.com/institute-sw/api/index_publish/trend/?swindexcode=<code>&period=DAY
  note: 'NEW. The CN sector map the mainland buy side uses: SW non-ferrous metals vs copper, SW coal/steel
    vs iron-ore AUD, SW banks vs CHINAH. Sector-rotation conditioner for CHINAH/HK50 and the commodity
    transfer channels.'
  mt5_assets:
  - CHINAH
  - HK50
  - XCUUSD
  - AUDUSD
  - USDCNH
  culture:
    source_culture: cn_mainland
    participant_structure: retail_heavy, policy_driven
  owner: breadth
  origin: 'github.com/dkl0707/QuantDatabase (no licence file: endpoints only)'
