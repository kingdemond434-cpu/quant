# RESEARCH CIVILIZATIONS -- source lanes (zuck, 2026-09-30).
#
# Read by the #133 spine through `external_rosters: desks/mt5/data/source_rosters/*.yaml`
# (libs/mining/acquirer.load_roster). Every row is ONE measurable lane with its own durable cursor
# (desks/mt5/data/mining/cursors/<id>.json) and its own ROI line in
# desks/mt5/reports/civilizations/SOURCE_ROI.json. The extra keys the spine ignores are read by
# libs/civilizations/resident.py:
#
#   civilization     worldquant | quantconnect | man_ahl | bridgewater | aqr | two_sigma | deshaw
#                    | winton | market_makers | renaissance
#   lane             the lane name the principal's blueprint uses
#   ontology_hint    the outcomes this lane is FOR (a prior, never a verdict: libs/civilizations/
#                    ontology.py decides per item and only ALPHA_MECHANISM reaches the gauntlet)
#   cadence_class    continuous (15 min) | hourly | daily | weekly -- the blueprint's cadences
#   the four culture fields (libs/research/cell_culture.py, #139), declared per lane
#
# New lanes are rows here or in civilizations_frontier.jsonl (written by the resident's source
# frontier worker when it discovers a public repo); never code. Public, lawful surfaces only:
# robots.txt is obeyed by the page fetchers, no login surface is scraped, dataset catalogues are
# mined for METADATA (a free-substitute ask), and no crypto venue is a source.

sources:
  # ================================================================ QUANTCONNECT (engineering lab)
  - {id: qc_strategy_library, civilization: quantconnect, lane: qc_strategy_library, priority: 2,
     name: "QuantConnect Strategy Library (every tutorial, via the sitemap, not the JS listing)",
     kind: code, fetcher: sitemap, cadence_minutes: 1440, cadence_class: daily,
     uses: [direct_cells, indirect_cells], ontology_hint: [ALPHA_MECHANISM],
     licence: "public pages; concept only, code never copied", region: us, language: en,
     source_culture: US/en, participant_structure: mixed, crowding_prior: high,
     failure_mode_hypothesis: "academic anomalies re-implemented on US equities; fail when the published premium is arbitraged",
     config: {sitemaps: ["https://www.quantconnect.com/sitemap.xml"],
              item_regex: "investment-strategy-library|/learning/articles/", pages_per_run: 80}}

  - {id: qc_strategy_library_search, civilization: quantconnect, lane: qc_strategy_library,
     priority: 4, name: "Strategy Library search route (grounds the sitemap misses)",
     kind: text, fetcher: search_route, cadence_minutes: 10080, cadence_class: weekly,
     uses: [direct_cells], ontology_hint: [ALPHA_MECHANISM], region: us, language: en,
     source_culture: US/en, participant_structure: mixed, crowding_prior: high,
     failure_mode_hypothesis: "same as the library",
     config: {engine: ddg, queries: ["site:quantconnect.com investment strategy library forex",
              "site:quantconnect.com strategy library futures momentum",
              "site:quantconnect.com strategy library commodities",
              "site:quantconnect.com strategy library mean reversion"]}}

  - {id: qc_shared_strategies, civilization: quantconnect, lane: qc_shared_strategies, priority: 2,
     name: "Community Strategies + leaderboard (daily re-backtested OOS metrics; forward-tracked)",
     kind: text, fetcher: page_snapshot, cadence_minutes: 1440, cadence_class: daily,
     uses: [direct_cells, allocation_intel], ontology_hint: [ALPHA_MECHANISM, VALIDATION_IDEA],
     region: us, language: en, source_culture: US/en, participant_structure: retail_heavy,
     crowding_prior: medium,
     failure_mode_hypothesis: "retail-authored algos selected on backtest; decay is the survivorship the forward tracker measures",
     config: {pages: [{url: "https://www.quantconnect.com/strategies", label: leaderboard}],
              forward_track: true}}

  - {id: qc_shared_strategy_pages, civilization: quantconnect, lane: qc_shared_strategies,
     priority: 3, name: "Community Strategy pages via sitemap", kind: code, fetcher: sitemap,
     cadence_minutes: 1440, cadence_class: daily, uses: [direct_cells],
     ontology_hint: [ALPHA_MECHANISM], region: us, language: en, source_culture: US/en,
     participant_structure: retail_heavy, crowding_prior: medium,
     failure_mode_hypothesis: "as the leaderboard",
     config: {sitemaps: ["https://www.quantconnect.com/sitemap.xml"], item_regex: "/strategies/\\d+",
              pages_per_run: 60, forward_track: true}}

  - {id: qc_research, civilization: quantconnect, lane: qc_research, priority: 2,
     name: "Community Research articles (full write-ups + implementations)", kind: code,
     fetcher: sitemap, cadence_minutes: 1440, cadence_class: daily,
     uses: [direct_cells, indirect_cells], ontology_hint: [ALPHA_MECHANISM, RESEARCH_METHOD],
     region: us, language: en, source_culture: US/en, participant_structure: mixed,
     crowding_prior: medium, failure_mode_hypothesis: "community research; weaker selection than the library",
     config: {sitemaps: ["https://www.quantconnect.com/sitemap.xml"], item_regex: "/research/\\d+",
              pages_per_run: 80}}

  - {id: qc_forum, civilization: quantconnect, lane: qc_forum, priority: 3,
     name: "Forum deep history (discussions with attached backtests/notebooks)", kind: code,
     fetcher: sitemap, cadence_minutes: 60, cadence_class: hourly,
     uses: [direct_cells, indirect_cells], ontology_hint: [ALPHA_MECHANISM, FAILURE_KNOWLEDGE],
     region: us, language: en, source_culture: US/en, participant_structure: retail_heavy,
     crowding_prior: medium, failure_mode_hypothesis: "retail forum; fails on costs and live fills",
     config: {sitemaps: ["https://www.quantconnect.com/sitemap.xml"],
              item_regex: "/forum/discussion/\\d+", pages_per_run: 120}}

  - {id: qc_forum_failures, civilization: quantconnect, lane: qc_forum, priority: 3,
     name: "Forum failure archaeology (backtest-vs-live, slippage, lookahead, rollover ...)",
     kind: text, fetcher: search_route, cadence_minutes: 1440, cadence_class: daily,
     uses: [indirect_cells, allocation_intel], ontology_hint: [FAILURE_KNOWLEDGE],
     region: us, language: en, source_culture: US/en, participant_structure: retail_heavy,
     crowding_prior: low, failure_mode_hypothesis: "negative knowledge; no crowding by construction",
     config: {engine: ddg, queries: [
       "site:quantconnect.com/forum \"worked in backtest\" live",
       "site:quantconnect.com/forum slippage different results live",
       "site:quantconnect.com/forum lookahead bias", "site:quantconnect.com/forum survivorship",
       "site:quantconnect.com/forum overfitting optimization",
       "site:quantconnect.com/forum fill model difference",
       "site:quantconnect.com/forum forex spread fees", "site:quantconnect.com/forum order rejected margin",
       "site:quantconnect.com/forum futures rollover", "site:quantconnect.com/forum data normalization",
       "site:quantconnect.com/forum \"stopped working\" algorithm",
       "site:quantconnect.com/forum alpha decay"]}}

  - {id: qc_learning, civilization: quantconnect, lane: qc_learning, priority: 5,
     name: "Learning Center / Bootcamp (strategy templates)", kind: code, fetcher: sitemap,
     cadence_minutes: 10080, cadence_class: weekly, uses: [direct_cells],
     ontology_hint: [ALPHA_MECHANISM, FEATURE_PRIMITIVE], region: us, language: en,
     source_culture: US/en, participant_structure: retail_heavy, crowding_prior: high,
     failure_mode_hypothesis: "textbook templates; crowded",
     config: {sitemaps: ["https://www.quantconnect.com/sitemap.xml"],
              item_regex: "/learning/(course|bootcamp|task|articles)", pages_per_run: 60}}

  - {id: qc_dataset_catalogue, civilization: quantconnect, lane: qc_dataset_catalogue, priority: 2,
     name: "Dataset Market METADATA (name, vendor, geography, frequency, mechanism) -> free substitutes",
     kind: text, fetcher: sitemap, cadence_minutes: 10080, cadence_class: weekly,
     uses: [indirect_cells, allocation_intel], ontology_hint: [DATA_IDEA],
     licence: "metadata only; dataset contents are never fetched or copied", region: us,
     language: en, source_culture: US/en, participant_structure: institutional,
     crowding_prior: medium, failure_mode_hypothesis: "paid vendor data; the free substitute is the orthogonal leg",
     config: {sitemaps: ["https://www.quantconnect.com/sitemap.xml"], item_regex: "/datasets/",
              pages_per_run: 80}}

  - {id: qc_docs, civilization: quantconnect, lane: qc_docs_changes, priority: 3,
     name: "QuantConnect Documentation repo (docs diff miner)", kind: text, fetcher: git_mirror,
     cadence_minutes: 60, cadence_class: hourly, immutable_time: true,
     uses: [indirect_cells, allocation_intel],
     ontology_hint: [EXECUTION_IDEA, DATA_IDEA, PORTFOLIO_IDEA, RISK_IDEA, INFRASTRUCTURE_PATTERN],
     region: us, language: en, source_culture: US/en, participant_structure: institutional,
     crowding_prior: medium, failure_mode_hypothesis: "engine capability, not alpha",
     config: {repo: "https://github.com/QuantConnect/Documentation", files_per_run: 200,
              paths: ["*.html", "*.md", "*.php", "*.py"], commits: true}}

  - {id: qc_tutorials, civilization: quantconnect, lane: qc_research_notebooks, priority: 3,
     name: "QuantConnect Tutorials repo (research notebooks)", kind: code, fetcher: git_mirror,
     cadence_minutes: 1440, cadence_class: daily, immutable_time: true,
     uses: [direct_cells, indirect_cells], ontology_hint: [RESEARCH_METHOD, ALPHA_MECHANISM],
     region: us, language: en, source_culture: US/en, participant_structure: mixed,
     crowding_prior: medium, failure_mode_hypothesis: "tutorial-grade methods",
     config: {repo: "https://github.com/QuantConnect/Tutorials", files_per_run: 120,
              paths: ["*.ipynb", "*.py", "*.md", "*.html"], commits: true}}

  - {id: qc_org_repos, civilization: quantconnect, lane: qc_github_org, priority: 3,
     name: "QuantConnect GitHub org (DataSource / Brokerage / tool repos; frontier seeds)",
     kind: text, fetcher: github_search, auth: optional, auth_env: GITHUB_TOKEN,
     cadence_minutes: 60, cadence_class: hourly, uses: [indirect_cells, allocation_intel],
     ontology_hint: [DATA_IDEA, EXECUTION_IDEA, INFRASTRUCTURE_PATTERN], region: us, language: en,
     source_culture: US/en, participant_structure: institutional, crowding_prior: low,
     failure_mode_hypothesis: "vendor and broker semantics; engineering edge",
     config: {search: repositories, queries: ["org:QuantConnect", "org:QuantConnect Lean.DataSource",
              "org:QuantConnect Lean.Brokerages"]}}

  # ---- LEAN: one mirror, many lanes (each its own cursor and ROI)
  - &lean {id: lean_algorithms, civilization: quantconnect, lane: lean_algorithms, priority: 1,
     name: "LEAN Algorithm.Python + Algorithm.CSharp (strategy/demos; classified per file)",
     kind: code, fetcher: git_mirror, cadence_minutes: 15, cadence_class: continuous,
     immutable_time: true, uses: [direct_cells, indirect_cells],
     ontology_hint: [ALPHA_MECHANISM], licence: "Apache-2.0 (LEAN)", region: us, language: en,
     source_culture: US/en, participant_structure: institutional, crowding_prior: high,
     failure_mode_hypothesis: "engine examples of canonical US-equity mechanisms",
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 200,
              paths: ["Algorithm.Python/*", "Algorithm.CSharp/*"],
              exclude: ["*RegressionAlgorithm*", "*/Benchmarks/*"]}}
  - {<<: *lean, id: lean_alpha_streams, lane: lean_algorithms, priority: 1,
     name: "LEAN Algorithm.Python/Alphas (the 14 former Alpha Streams strategies)",
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 50,
              paths: ["Algorithm.Python/Alphas/*", "Algorithm.CSharp/Alphas/*"]}}
  - {<<: *lean, id: lean_framework, lane: lean_framework, priority: 1,
     name: "LEAN Algorithm.Framework (Universe/Alpha/Portfolio/Risk/Execution components)",
     ontology_hint: [ALPHA_MECHANISM, PORTFOLIO_IDEA, RISK_IDEA, EXECUTION_IDEA, UNIVERSE_IDEA],
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 100,
              paths: ["Algorithm.Framework/*"]}}
  - {<<: *lean, id: lean_indicators, lane: lean_indicators, priority: 2,
     name: "LEAN Indicators (transformations -> representation primitives, not crossovers)",
     uses: [indirect_cells], ontology_hint: [FEATURE_PRIMITIVE],
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 250,
              paths: ["Indicators/*"]}}
  - {<<: *lean, id: lean_reality_models, lane: lean_execution_models, priority: 2,
     name: "LEAN reality models (fills, slippage, fees, buying power, margin, settlement, hours)",
     uses: [allocation_intel], ontology_hint: [EXECUTION_IDEA, VALIDATION_IDEA],
     crowding_prior: low, failure_mode_hypothesis: "a cost/fill assumption differing from Fusion is an execution hypothesis",
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 200,
              paths: ["Common/Orders/Fills/*", "Common/Orders/Slippage/*", "Common/Orders/Fees/*",
                      "Common/Securities/*BuyingPower*", "Common/Securities/*Margin*",
                      "Common/Securities/*Settlement*", "Common/Securities/*MarketHours*",
                      "Common/Brokerages/*Model*"],
              exclude: ["*Binance*", "*Bybit*", "*Kraken*", "*Coinbase*", "*GDAX*", "*Bitfinex*",
                        "*FTX*", "*dYdX*", "*Crypto*"]}}
  - {<<: *lean, id: lean_regression_tests, lane: lean_regression_archaeology, priority: 2,
     name: "LEAN regression algorithms (failure mode -> MT5 analogue -> test to add)",
     uses: [allocation_intel], ontology_hint: [FAILURE_KNOWLEDGE, VALIDATION_IDEA],
     crowding_prior: low, failure_mode_hypothesis: "engine edge cases; negative knowledge",
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 300,
              paths: ["Algorithm.Python/*RegressionAlgorithm*", "Algorithm.CSharp/*RegressionAlgorithm*"]}}
  - {<<: *lean, id: lean_tests, lane: lean_regression_archaeology, priority: 3,
     name: "LEAN Tests tree (Engine, Brokerages, Indicators, Optimizer, Research, ToolBox)",
     cadence_minutes: 1440, cadence_class: daily, uses: [allocation_intel],
     ontology_hint: [FAILURE_KNOWLEDGE], crowding_prior: low,
     failure_mode_hypothesis: "engine edge cases; negative knowledge",
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 300,
              paths: ["Tests/*"], exclude: ["*.csv", "*.zip", "*.json", "*/TestData/*"]}}
  - {<<: *lean, id: lean_optimizer, lane: lean_optimizer, priority: 3,
     name: "LEAN Optimizer (search methods, objectives, constraints) -> meta-R&D, never a looser bar",
     cadence_minutes: 1440, cadence_class: daily, uses: [allocation_intel],
     ontology_hint: [RESEARCH_METHOD], crowding_prior: low,
     failure_mode_hypothesis: "search machinery, charged by lifetime multiplicity here",
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 60,
              paths: ["Optimizer/*", "Optimizer.Launcher/*"]}}
  - {<<: *lean, id: lean_research, lane: lean_research, priority: 3,
     name: "LEAN Research + ToolBox (methodology, notebooks, data tooling)",
     cadence_minutes: 1440, cadence_class: daily, uses: [indirect_cells, allocation_intel],
     ontology_hint: [RESEARCH_METHOD, DATA_IDEA],
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 100,
              paths: ["Research/*", "ToolBox/*", "*.ipynb"]}}
  - {<<: *lean, id: lean_commits, lane: lean_commits, priority: 2,
     name: "LEAN commit/delta miner (Alphas, Portfolio, Risk, Execution, Indicators, Brokerages, Data, Optimizer, Research)",
     cadence_minutes: 15, cadence_class: continuous, uses: [indirect_cells, allocation_intel],
     ontology_hint: [INFRASTRUCTURE_PATTERN, FAILURE_KNOWLEDGE, FEATURE_PRIMITIVE],
     config: {repo: "https://github.com/QuantConnect/Lean", mirror: lean, files_per_run: 50,
              commits: true, backfill: false, paths: ["Algorithm.Framework/*", "Indicators/*", "Common/Orders/*",
              "Common/Brokerages/*", "Common/Data/*", "Optimizer/*", "Research/*"]}}
  - {id: lean_issues, civilization: quantconnect, lane: lean_issues, priority: 2,
     name: "LEAN issues (real failure modes, ten categories)", kind: text, fetcher: github_search,
     auth: optional, auth_env: GITHUB_TOKEN, cadence_minutes: 60, cadence_class: hourly,
     immutable_time: true, uses: [allocation_intel], ontology_hint: [FAILURE_KNOWLEDGE],
     region: us, language: en, source_culture: US/en, participant_structure: mixed,
     crowding_prior: low, failure_mode_hypothesis: "engine failure reports; negative knowledge",
     config: {search: issues, readme: false, start: "2015-01-01",
              queries: ["repo:QuantConnect/Lean is:issue"]}}
  - {id: lean_prs, civilization: quantconnect, lane: lean_prs, priority: 2,
     name: "LEAN pull requests (new capabilities, fixes)", kind: text, fetcher: github_search,
     auth: optional, auth_env: GITHUB_TOKEN, cadence_minutes: 60, cadence_class: hourly,
     immutable_time: true, uses: [allocation_intel],
     ontology_hint: [INFRASTRUCTURE_PATTERN, FAILURE_KNOWLEDGE], region: us, language: en,
     source_culture: US/en, participant_structure: institutional, crowding_prior: low,
     failure_mode_hypothesis: "engine changes", config: {search: issues, readme: false,
     start: "2015-01-01", queries: ["repo:QuantConnect/Lean is:pr"]}}

  # ================================================================ WORLDQUANT (alpha factory)
  - {id: wq_public_pages, civilization: worldquant, lane: wq_official, priority: 2,
     name: "WorldQuant BRAIN / IQC / Learn2Quant public pages (delta-scanned snapshots)",
     kind: text, fetcher: page_snapshot, cadence_minutes: 60, cadence_class: hourly,
     uses: [indirect_cells, allocation_intel], ontology_hint: [RESEARCH_METHOD, DATA_IDEA],
     licence: "public, unauthenticated pages only; no BRAIN account is used", region: global,
     language: en, source_culture: GLOBAL, participant_structure: institutional,
     crowding_prior: high, failure_mode_hypothesis: "the most-mined public alpha vocabulary; novelty must come from translation and conditioning",
     config: {pages: [{url: "https://www.worldquant.com/brain/", label: brain},
                      {url: "https://www.worldquant.com/brain/iqc/", label: iqc},
                      {url: "https://www.worldquant.com/learn2quant/", label: learn2quant},
                      {url: "https://www.worldquant.com/ideas/", label: ideas},
                      {url: "https://platform.worldquantbrain.com/learn", label: brain_learn}]}}
  - {id: wq_ideas_sitemap, civilization: worldquant, lane: wq_official, priority: 2,
     name: "worldquant.com ideas / research articles (sitemap)", kind: text, fetcher: sitemap,
     cadence_minutes: 1440, cadence_class: daily, uses: [direct_cells, indirect_cells],
     ontology_hint: [ALPHA_MECHANISM, RESEARCH_METHOD], region: global, language: en,
     source_culture: GLOBAL, participant_structure: institutional, crowding_prior: high,
     failure_mode_hypothesis: "house research essays; mechanism class, not parameters",
     config: {sitemaps: ["https://www.worldquant.com/sitemap.xml"], item_regex: "/ideas/|/brain/",
              pages_per_run: 60}}
  - {id: wq_papers_arxiv, civilization: worldquant, lane: wq_papers, priority: 2,
     name: "arXiv: formulaic alphas, alpha mining, Kakushadze and citing work", kind: text,
     fetcher: rss, cadence_minutes: 1440, cadence_class: daily, immutable_time: true,
     uses: [direct_cells, indirect_cells], ontology_hint: [ALPHA_MECHANISM, RESEARCH_METHOD],
     region: global, language: en, source_culture: GLOBAL, participant_structure: institutional,
     crowding_prior: medium, failure_mode_hypothesis: "academic; the search method is the transferable part",
     config: {feeds: [
       "http://export.arxiv.org/api/query?search_query=all:%22formulaic%20alpha%22&sortBy=submittedDate&max_results=50",
       "http://export.arxiv.org/api/query?search_query=all:%22alpha%20mining%22&sortBy=submittedDate&max_results=50",
       "http://export.arxiv.org/api/query?search_query=au:Kakushadze&sortBy=submittedDate&max_results=50",
       "http://export.arxiv.org/api/query?search_query=all:%22factor%20mining%22%20AND%20all:genetic&sortBy=submittedDate&max_results=50",
       "http://export.arxiv.org/api/query?search_query=all:%22alpha%20factor%22%20AND%20all:%22large%20language%22&sortBy=submittedDate&max_results=50"]}}
  - {id: wq_repos, civilization: worldquant, lane: wq_repository_civilization, priority: 1,
     name: "Public BRAIN tools, alpha miners, GP/MCTS systems, validators, Alpha101 forks",
     kind: code, fetcher: github_search, auth: optional, auth_env: GITHUB_TOKEN,
     cadence_minutes: 15, cadence_class: continuous, uses: [direct_cells, indirect_cells],
     ontology_hint: [ALPHA_MECHANISM, RESEARCH_METHOD, FEATURE_PRIMITIVE], region: global,
     language: en, source_culture: GLOBAL, participant_structure: mixed, crowding_prior: medium,
     failure_mode_hypothesis: "consultant tooling; mechanisms crowded, search machinery less so",
     config: {search: repositories, discover_regex: "github\\.com/([\\w.-]+/[\\w.-]+)$",
              discover_into: wq_repo_frontier,
              queries: ["worldquant brain", "worldquant alpha", "alpha101", "101 formulaic alphas",
                        "brain api simulate alpha", "worldquant consultant", "alpha factor genetic programming",
                        "gplearn alpha factor", "formulaic alpha mining", "alpha mining llm",
                        "alpha158 qlib", "factor mining symbolic regression"]}}
  - {id: wq_repo_frontier, civilization: worldquant, lane: wq_repository_civilization, priority: 3,
     name: "Frontier holder: repos discovered by wq_repos (the resident promotes them to git_mirror rows)",
     kind: code, fetcher: owned, owner: civilizations/frontier, cadence_minutes: 60,
     cadence_class: hourly, uses: [direct_cells], ontology_hint: [ALPHA_MECHANISM],
     region: global, language: en, source_culture: GLOBAL, participant_structure: mixed,
     crowding_prior: medium, failure_mode_hypothesis: "as wq_repos",
     consumer: libs/civilizations/resident.py}
  - {id: wq_alpha101_yli188, civilization: worldquant, lane: wq_alpha101_lineage, priority: 2,
     name: "Alpha101 lineage: yli188/WorldQuant_alpha101_code (paper formulas + two implementations)",
     kind: code, fetcher: git_mirror, cadence_minutes: 10080, cadence_class: weekly,
     immutable_time: true, uses: [direct_cells, indirect_cells],
     ontology_hint: [ALPHA_MECHANISM, FAILURE_KNOWLEDGE], region: global, language: en,
     source_culture: GLOBAL, participant_structure: institutional, crowding_prior: high,
     failure_mode_hypothesis: "the most-copied formula set; implementation disagreements are the cells",
     config: {repo: "https://github.com/yli188/WorldQuant_alpha101_code", files_per_run: 20,
              paths: ["*.py", "*.md"]}}
  - {id: wq_alpha191_gtja, civilization: worldquant, lane: wq_alpha101_lineage, priority: 2,
     name: "Chinese lineage: GTJA 191 alphas (国泰君安 191) implementations", kind: code,
     fetcher: github_search, auth: optional, auth_env: GITHUB_TOKEN, cadence_minutes: 1440,
     cadence_class: daily, uses: [direct_cells, indirect_cells], ontology_hint: [ALPHA_MECHANISM],
     region: cn, language: zh, source_culture: CN/zh, participant_structure: retail_heavy,
     crowding_prior: medium,
     failure_mode_hypothesis: "built for A-share retail flow (T+1, limit bands); translated to MT5 it should fail on different days than the US canon",
     config: {search: repositories, discover_regex: "github\\.com/([\\w.-]+/[\\w.-]+)$",
              discover_into: wq_repo_frontier,
              queries: ["alpha191", "gtja 191", "国泰君安 191", "191 alphas", "alpha 191 因子"]}}
  - {id: wq_community_search, civilization: worldquant, lane: wq_community, priority: 3,
     name: "BRAIN community: consultant posts, IQC write-ups, videos (snippets; LLM lane reads deep)",
     kind: text, fetcher: search_route, cadence_minutes: 1440, cadence_class: daily,
     uses: [direct_cells, indirect_cells], ontology_hint: [ALPHA_MECHANISM, RESEARCH_METHOD],
     region: global, language: en, source_culture: GLOBAL, participant_structure: retail_heavy,
     crowding_prior: medium, failure_mode_hypothesis: "consultant folklore; many languages",
     config: {engine: ddg, queries: ["worldquant brain alpha expression ts_rank",
              "worldquant brain operators group_neutralize tutorial", "IQC worldquant alpha idea",
              "worldquant brain consultant tips self correlation", "site:youtube.com worldquant brain alpha",
              "worldquant brain 因子 表达式", "worldquant brain alpha ý tưởng",
              "worldquant brain alpha kaise banaye", "site:medium.com worldquant brain alpha"]}}
  - {id: wq_failures_search, civilization: worldquant, lane: wq_failures, priority: 3,
     name: "BRAIN failure mining (self-correlation, turnover, decay, overfitting)", kind: text,
     fetcher: search_route, cadence_minutes: 1440, cadence_class: daily,
