# Data sources of github.com/AgriQuantAI/AgriQuant-AI (crop, weather and supply models for coffee, cocoa, sugar,
# corn and wheat), mined 2026-10-01 as conditioners for the broker's soft and grain CFDs (COFARA, COFROB, USCOCOA,
# UKCOCOA, SUGAR, SUGARRAW, CORN, WHEAT, SOYBEAN, COTTON, OJ). The repo has no LICENSE file (an MIT badge only),
# so only facts are taken: its growing-region coordinates, production shares (unverified) and damage thresholds
# live in libs/data/crop_weather.py, which reads NASA POWER and runs hourly in acquire_datasets.
# Deduped against the desk: USDA PSD/WASDE (firm_mining sources), Drought Monitor and NHC (countries/us/pack.py,
# side_channels/weather_miner.py), CONAB/ICO/ICCO (asia_sources.json, deep_forest_sources.json), CHIRPS
# (countries/gh, ke packs) and IRI/CPC ENSO are already held and are NOT re-rostered. Open-Meteo, AgriQuant's main
# weather feed, is skipped: its free tier is non-commercial. Shapers: Breadth.
sources:
- id: nasa_power_crop_belts
  name: NASA POWER daily point API (T2M_MIN, T2M_MAX, PRECTOTCORR) at 38 crop-belt centroids
  priority: 1
  kind: weather
  uses: [conditioners, direct_cells, allocation_intel]
  fetcher: libs/data/crop_weather.py via repo_mined_feeds.absorb_crop_weather (hourly acquire_datasets leg)
  auth: none
  cadence_minutes: 60
  region: global
  language: en
  licence: US government (NASA LaRC) public data, no key; terms confirmed by the owner thread on the box (this
    container's network policy refuses the host)
  terms_status: BLOCKED_ON_TERMS
  config:
    url: https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M_MIN,T2M_MAX,PRECTOTCORR&community=AG
  note: 'NEW and WIRED. Per crop: tmin, tmax, prcp, prcp30, prcp30_z (vs prior-year same season), frost7, heat7.
    First-print ledger; revised=True, settle 60 days. Frost lines: coffee/sugar 2 C, OJ 0 C; heat lines corn/soy 35,
    wheat 34, cotton 38.'
  mt5_assets: [COFARA, COFROB, USCOCOA, UKCOCOA, SUGAR, SUGARRAW, CORN, WHEAT, SOYBEAN, COTTON, OJ]
  culture:
    source_culture: us_government_science
    participant_structure: producer_weather_risk, commercial_hedgers
  owner: breadth
  origin: github.com/AgriQuantAI/AgriQuant-AI (no licence file; region facts only)
- id: inmet_station_daily
  name: INMET (Instituto Nacional de Meteorologia) automatic-station daily series, coffee-belt stations A519, A524,
    A537, A612, A706
  priority: 1
  kind: weather
  uses: [conditioners, direct_cells]
  fetcher: json_api
  auth: key
  cadence_minutes: 1440
  region: br
  language: pt
  licence: Brazilian public data; apitempo requires a free registered token (the user sets keys on the box)
  terms_status: BLOCKED_ON_TERMS
  config:
    url: https://apitempo.inmet.gov.br/estacao/diaria/<start>/<end>/<station>
  note: 'NEW. Station truth for the Sul de Minas / Cerrado / Matas / Espirito Santo / Mogiana frost nights, which a
    0.5-degree reanalysis smooths. The 1994, 2000, 2011, 2013 and 2021 frost record in AgriQuant is the falsifier
    set: frost7 must lead COFARA on those dates or the conditioner is wrong.'
  mt5_assets: [COFARA, COFROB, SUGAR, SUGARRAW, OJ]
  culture:
    source_culture: br_producer
    participant_structure: cooperative_growers, exporters
  owner: breadth
  origin: github.com/AgriQuantAI/AgriQuant-AI
