# OpenBB-finance/OpenBB (Apache-2.0) provider extensions, absorbed 2026-10-01. Every provider in
# the repo is free (bls, cboe, cftc, ecb, eia, famafrench, federal_reserve, finra, fred,
# government_us, imf, jodi, nasdaq, oecd, sec, tmx). FRED, EIA, CFTC COT, the SEC EDGAR basics and
# ECB FX reference rates were already on the desk and are not repeated. deribit is a crypto venue
# and is fenced. The first row is FED HOURLY; the rest wait on the roster acquirer (#133) or a
# Breadth shaper. Read by libs/mining/acquirer.load_roster.
sources:
- id: obb_dtcc_fx_options
  name: DTCC CFTC public price dissemination, FX options (cumulative daily slices)
  priority: 1
  kind: mechanics
  uses:
  - direct_cells
  - indirect_cells
  - allocation_intel
  fetcher: json_api
  fed_by: acquire_datasets
  auth: none
  cadence_minutes: 60
  region: global
  language: en
  licence: public government / exchange data, keyless; terms confirmed by the owner thread before fetch
    (terms gate fails closed)
  config:
    url: https://pddata.dtcc.com/ppd/api/cumulative/CFTC/FX
  note: 'FED HOURLY: libs/data/dtcc_fx_options.py via acquire_datasets. ATM-vol proxy, call share, OTM
    call share, notional per MT5 FX pair'
