  mt5_assets: [USDCNH, CHINAH]
  culture:
    source_culture: cn_mainland
    participant_structure: policy_driven
  owner: breadth
  origin: github.com/yutiansut/QUANTAXIS QAFetch/QAHexun.py (MIT)
