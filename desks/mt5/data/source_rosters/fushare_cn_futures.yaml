# LowinLi/fushare, absorbed 2026-10-01: every endpoint it scrapes for China's four futures exchanges and
# 100ppi spot/basis. Deduped against the CN pack (desks/mt5/research/countries/cn/pack.py), which DESCRIBED
# member positions and weekly stocks with no fetch URL, and against rm_em_push2his_kline (Eastmoney,
# dominant contract only). AkShare is fushare's descendant; the desk's akshare adapter calls only stock_zh_a_hist,
# futures_main_sina and macro_china_cpi, so none of these endpoints was held. Every row is BLOCKED_ON_TERMS until the box
# reads the exchange's terms page (this container cannot reach the hosts). Shapers: Breadth.
sources:
- id: fs_100ppi_spot_basis
  name: '100ppi (生意社) 现期表: daily physical spot price, nearest and dominant futures price and basis for
    ~50 SHFE/DCE/CZCE/INE commodities'
  priority: 1
  kind: mechanics
  uses: &id001
  - direct_cells
  - indirect_cells
  - allocation_intel
  fetcher: json_api
  auth: none
  cadence_minutes: 1440
  region: cn
  language: zh
  licence: exchange bulletin page, public; terms NOT YET CONFIRMED -- this container's network policy
    refuses the host (host_not_allowed), so the terms gate holds the row BLOCKED_ON_TERMS until the box
    reads the exchange's terms page; the gate fails closed
  terms_status: BLOCKED_ON_TERMS
  config:
    url: http://www.100ppi.com/sf/day-%Y-%m-%d.html
  note: 'NEW to the desk. Spot-futures basis is the physical-tightness read the CN pack names but never
    fetched: a widening backwardation in copper, aluminium, zinc, nickel or crude is onshore demand before
    it reaches LME/COMEX. Conditions XCUUSD, XALUSD, XZNUSD, XNIUSD, XTIUSD and, through iron ore, AUDUSD.'
  mt5_assets:
  - XCUUSD
  - XALUSD
  - XZNUSD
  - XNIUSD
  - XTIUSD
  - XBRUSD
  - AUDUSD
  - XAUUSD
  - XAGUSD
  culture:
    source_culture: cn_mainland
    participant_structure: retail_heavy, policy_driven
    crowding_prior: low (Western desks rarely parse exchange bulletins in Chinese)
  owner: breadth
  origin: 'github.com/LowinLi/fushare (no licence file: endpoints are taken as facts, no code copied)'
