# thuquant/awesome-quant (MIT, Tsinghua's curated Chinese quant list), absorbed 2026-09-30.
#
# Only what no roster held. Already covered and NOT repeated here: SAFE, PBOC, CFETS fixing,
# SGE, SHFE/INE/DCE/CZCE/GFEX/CFFEX dailies and member ranks, AkShare, TuShare, RQData, Wind
# (desks/mt5/data/asia_sources.json), and the JoinQuant / Uqer / Ricequant / BigQuant / Xueqiu /
# Zhihu grounds (desks/mt5/data/deep_forest_sources.json). Paid-only rows on the list (Wind EDB,
# RESSET, CSMAR/GTA, Hundsun, Chinascope, RQData, kdb) and crypto-venue rows (0xArchive,
# CoinNudge, godzilla.dev) are not rostered. Read by libs/mining/acquirer.load_roster (#133).
sources:
- id: thu_tqsdk
  name: 'TqSdk (Shinny) free CN futures and options quotes, ticks and klines: SHFE/INE/DCE/CZCE/CFFEX/GFEX'
  priority: 2
  kind: mechanics
  uses:
  - direct_cells
  - indirect_cells
  - allocation_intel
  fetcher: json_api
  auth: login
  auth_env: TQ_USER
  cadence_minutes: 60
  region: cn
  language: zh
  licence: Apache-2.0 SDK; free account (self-registrable, 2026-09-30 data-access ruling)
  config:
    url: https://github.com/shinnytech/tqsdk-python
  note: CN futures ticks for SHFE gold/copper, INE crude, CFFEX IF/IH -> XAUUSD, XCUUSD, XTIUSD, China50 lead-lag
    cells
  owner: elitequant_thread
  origin: github.com/thuquant/awesome-quant
