# SHADOW TRIAL of the false-finding adjudicator (ops/release/adjudicate.py). Dispatch only; it
# reads public PR diffs and writes a report artifact. It gates nothing, posts nothing and merges
# nothing. Governance 2026-11-04 21:07Z: shadow first; enforcement is a separate PR on zuck's word.
name: adjudication-shadow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adjudication-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same pinned Ollama archive the reviewer uses (local_models.json); the adjudicator's
      # model is pulled by name and its manifest sha256 is printed for Governance to pin.
      - name: Serve the adjudicator model on this runner
        id: serve
        timeout-minutes: 30
        env:
          OLLAMA_MAX_LOADED_MODELS: "1"
          OLLAMA_NUM_PARALLEL: "1"
        run: |
          cfg=ops/release/local_models.json
          pin() { python -I -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; print(v or "")' "$cfg" "$1"; }
          dir="$RUNNER_TEMP/ollama"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ollama.tgz" "$(pin archive)"
          got=$(sha256sum "$dir/ollama.tgz" | cut -d' ' -f1)
          want=$(pin archive_sha256)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::the Ollama archive does not match its pin ($want)"; exit 1
          fi
          tar -xzf "$dir/ollama.tgz" -C "$dir"
          nohup "$dir/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          m=$(python -I -c 'import json; print(json.load(open("ops/release/adjudicator_model.json"))["name"])')
          "$dir/bin/ollama" pull "$m"
          repo=${m%%:*}; tag=${m#*:}
          d=$(sha256sum ~/.ollama/models/manifests/registry.ollama.ai/library/$repo/$tag | cut -d' ' -f1)
          echo "manifest sha256 $m $d"
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Shadow trial (logs only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I ops/release/adjudicate.py shadow --repo "${{ github.repository }}" \
            --report "$RUNNER_TEMP/adjudication_shadow.json"
          python -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print("## Adjudicator shadow trial\n\n```json\n"+json.dumps(d["summary"],indent=1)+"\n```")' \
            "$RUNNER_TEMP/adjudication_shadow.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adjudication-shadow
          path: ${{ runner.temp }}/adjudication_shadow.json
          if-no-files-found: warn
