name: ci

# The daily autonomous cycle commits to the same tree the VPS runs, so nothing must reach
# live capital ungated. This gate runs the project's own declared tooling (ruff + mypy +
# pytest) on every push and PR. A red gate blocks the merge; the executor and the deadman
# ruin-rail are covered by the same run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: LAW GATE (constitutional -- portable fences)
        # L1.37: laws were enforced on cron ticks and nowhere else, so a breach could enter the
        # tree between ticks with nothing watching. This runs the portable law fences (sealed
        # core, law families, timidity incl. all prompt surfaces, enforcement matrix, scheduler
        # manifest) on EVERY push and PR. State fences are box-only by design and run there.
        run: python scripts/run_law_gate.py --laws-only

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy --strict)
        run: mypy

      # L1.37: enforce the portable constitution/family/wiring fences before a commit can enter.
      # Live-state checks remain on the VPS; a clean CI worker must not manufacture desk state.
      - name: Laws (portable)
        run: python scripts/run_law_gate.py --laws-only

      # COVERAGE IS MEASURED HERE OR IT IS NOT MEASURED AT ALL. pytest-cov has been a declared
      # dev dependency and [tool.coverage.run] has carried branch=true for as long as either has
      # existed, and this step ran bare `pytest` -- so the tooling was installed, configured, and
      # never once invoked. First measurement, 2026-08-04: 88.1% repo-wide, and the money path at
      # 41.6%, which is backwards from where the care belongs.
      - name: Tests (pytest + branch coverage)
        run: pytest --cov=libs --cov-branch --cov-report=term:skip-covered --cov-report=json:coverage.json

      # Two floors, not one: a repo-wide average lets ORDER-PATH coverage fall while a wave of
      # research tests keeps the aggregate up, which hides precisely the number worth watching.
      # Floors only ever rise.
      - name: Coverage floors (ratcheted)
        run: python scripts/check_coverage_floors.py --report coverage.json

  # THE MT5 MONEY PATH HAS ITS OWN GATE. The job above measures `libs`; the code that actually
  # places, sizes and vetoes orders lives under desks/mt5 and was outside every number CI
  # reported. This job runs the desk's suite with branch coverage on that path, holds it to its
  # own ratcheted floor, and then checks the two integration invariants the audit named: every
  # producer on the desk reaches a decision (capability graph) and ingested rows carry
  # point-in-time provenance (PIT census, ratcheted). Any of the four failing blocks the merge.
  mt5-money-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The gateway cannot be imported off Windows (MetaTrader5); its tests exec functions from
      # the source. Files absent from the report are reported by the floor, never scored zero.
      - name: MT5 desk suite (branch coverage on the money path)
        run: >-
          pytest desks/mt5/tests -q -p no:randomly --timeout=600
          --cov=desks/mt5/mt5desk --cov=desks/mt5/research --cov-branch
          --cov-report=term:skip-covered --cov-report=json:mt5cov.json

      - name: Money-path coverage floor (ratcheted)
        run: python scripts/check_mt5_coverage_floor.py --report mt5cov.json

      - name: Capability graph (every producer reaches a decision)
        run: python scripts/check_reachability.py

      - name: Point-in-time provenance census (ratcheted)
        run: python scripts/check_pit.py
