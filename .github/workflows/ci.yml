name: ci

# The daily autonomous cycle commits to the same tree the VPS runs, so nothing must reach
# live capital ungated. This gate runs the project's own declared tooling (ruff + mypy +
# pytest) on every push and PR. A red gate blocks the merge; the executor and the deadman
# ruin-rail are covered by the same run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # ONE GROUP PER PUSHED COMMIT. GitHub keeps one pending run per group and cancels the older
  # pending one whatever cancel-in-progress says, so with a per-branch group every live push
  # still cancelled the last (20 runs cancelled on 2026-09-30) and live never finished a run.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # A push run on a shared branch always finishes: every live run 11:42-12:54Z on 2026-09-30
  # was cancelled by the next push, so live never produced a base set. PR runs still supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # RAISED FROM 20, 2026-09-05, because 20 had started FAILING THE MERGE ON THE CLOCK rather
    # than on anything about the code. Measured on 806c98fa: the job began at 20:14:35, spent
    # 3m20s on install and the four law/lint/type steps, entered `pytest --cov` at 20:17:55 and
    # was killed at 20:34:48 -- exactly twenty minutes -- with `Coverage floors` skipped and the
    # whole run reported `cancelled`. `mt5-money-path` passed on the same commit in 11m04s, so
    # the tree was green and the merge was blocked by a budget.
    #
    # A cap that fires on duration is indistinguishable downstream from a real failure, which is
    # the worse half of the problem: it reads as a red gate, so the response is to go looking for
    # a broken test that does not exist. 45 leaves the suite room to keep growing -- it is meant
    # to -- while still failing loudly if something genuinely hangs, which is what a timeout is
    # for. The full-repo suite with branch coverage is simply a bigger job than it was.
    timeout-minutes: 45
    # What `promote` writes into the release tag: the law gate's own verdict line and the
    # suite's counts, read from this job's artifacts rather than restated by hand.
    outputs:
      law_gate: ${{ steps.evidence.outputs.law_gate }}
      suite: ${{ steps.evidence.outputs.suite }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: LAW GATE (constitutional -- portable fences)
        # L1.37: laws were enforced on cron ticks and nowhere else, so a breach could enter the
        # tree between ticks with nothing watching. This runs the portable law fences (sealed
        # core, law families, timidity incl. all prompt surfaces, enforcement matrix, scheduler
        # manifest) on EVERY push and PR. State fences are box-only by design and run there.
        run: |
          set -o pipefail
          python scripts/run_law_gate.py --laws-only | tee law_gate.txt

      - name: Lint (ruff)
        run: ruff check .

      # desks/mt5 is excluded from the root ruff config (its style debt is large), but a name that
      # does not exist is not style: it is a NameError waiting on a code path. Held at zero here.
      - name: Lint desks/mt5 (bug class only)
        run: ruff check desks/mt5 --isolated --target-version py311 --select E9,F63,F7,F82

      - name: Types (mypy --strict)
        run: mypy

      # L1.37: enforce the portable constitution/family/wiring fences before a commit can enter.
      # Live-state checks remain on the VPS; a clean CI worker must not manufacture desk state.
      - name: Laws (portable)
        run: python scripts/run_law_gate.py --laws-only

      # COVERAGE IS MEASURED HERE OR IT IS NOT MEASURED AT ALL. pytest-cov has been a declared
      # dev dependency and [tool.coverage.run] has carried branch=true for as long as either has
      # existed, and this step ran bare `pytest` -- so the tooling was installed, configured, and
      # never once invoked. First measurement, 2026-08-04: 88.1% repo-wide, and the money path at
      # 41.6%, which is backwards from where the care belongs.
      - name: Tests (pytest + branch coverage)
        run: pytest -n auto --dist loadfile --cov=libs --cov-branch --cov-report=term:skip-covered --cov-report=json:coverage.json --junitxml=quality-junit.xml

      # Two floors, not one: a repo-wide average lets ORDER-PATH coverage fall while a wave of
      # research tests keeps the aggregate up, which hides precisely the number worth watching.
      # Floors only ever rise.
      - name: Coverage floors (ratcheted)
        run: python scripts/check_coverage_floors.py --report coverage.json

      - name: Release evidence (law gate verdict + suite counts)
        id: evidence
        run: python scripts/release_promotion.py counts --junit quality-junit.xml --law-log law_gate.txt >> "$GITHUB_OUTPUT"

  # THE MT5 MONEY PATH HAS ITS OWN GATE. The job above measures `libs`; the code that actually
  # places, sizes and vetoes orders lives under desks/mt5 and was outside every number CI
  # reported. This job runs the desk's suite with branch coverage on that path, holds it to its
  # own ratcheted floor, and then checks the two integration invariants the audit named: every
  # producer on the desk reaches a decision (capability graph) and ingested rows carry
  # point-in-time provenance (PIT census, ratcheted). Any of the four failing blocks the merge.
  mt5-money-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      suite: ${{ steps.evidence.outputs.suite }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The gateway cannot be imported off Windows (MetaTrader5); its tests exec functions from
      # the source. A money-path file absent from the report FAILS the floor unless excused by
      # name in the script's allowlist; the gateway is in the report at ~0.6% (import prelude
      # only) and is floored there.
      # PARALLEL, NOT PRUNED (2026-09-29). Serially this step alone reached the job's 30-minute
      # cap. Every test still runs; xdist spreads files across the runner's cores (loadfile keeps
      # a file's tests, and their module fixtures, on one worker) and pytest-cov combines the
      # per-worker coverage before the floor below reads it.
      - name: MT5 desk suite (branch coverage on the money path)
        run: >-
          pytest desks/mt5/tests -q -p no:randomly --timeout=600 -n auto --dist loadfile
          --cov=desks/mt5/mt5desk --cov=desks/mt5/research --cov-branch
          --cov-report=term:skip-covered --cov-report=json:mt5cov.json --junitxml=mt5-junit.xml

      # The baselines (desks/mt5/data/coverage_high_water.json, pit_high_water.json) are
      # COMMITTED and the floor FAILS without them -- a ratchet with no memory is not a ratchet.
      - name: Money-path coverage floor (ratcheted)
        run: python scripts/check_mt5_coverage_floor.py --report mt5cov.json

      # A runner that measures HIGHER than the committed baseline rewrites the baseline on its
      # own disk and then throws that disk away. Surface the rise instead of losing it -- a
      # warning, never a failure: a higher measurement is good news that needs a commit.
      - name: Ratchet rose on the runner? (commit the new baseline)
        run: >-
          git diff --exit-code desks/mt5/data/coverage_high_water.json
          desks/mt5/data/pit_high_water.json
          || echo "::warning::ratchet rose on the runner -- commit the new baseline"

      - name: Capability graph (every producer reaches a decision)
        run: python scripts/check_reachability.py

      - name: Point-in-time provenance census (ratcheted)
        run: python scripts/check_pit.py

      # ARCHITECTURAL ONLY ON THE RUNNER, and that is the whole reason the fence has two modes.
      # A CI checkout has no lake: every artifact-dependent rung answers "absent" for honest
      # reasons, so --operational here would fail every build forever and everyone would learn
      # to ignore it (L1.37). What IS answerable from the tree alone -- does the module exist,
      # does production import it, does a scheduler name it, does anything read its artifact --
      # is answerable identically on every host, and those are enforced.
      #
      # The auditor's own problems stay fatal in both modes: the flat 20% heat floor is the
      # principal's one fixed policy and MEASURED-without-rent is the mandate's measurement law,
      # and neither depends on which machine is asking.
      - name: Blueprint coverage fence (mandate §4, architectural)
        run: python scripts/check_blueprint_coverage.py

      - name: Release evidence (suite counts)
        id: evidence
        run: python scripts/release_promotion.py counts --junit mt5-junit.xml >> "$GITHUB_OUTPUT"

  # THE SEAL IS ITS OWN COMMIT. Once both gates are green on a push to a branch the box pulls,
  # HEAD is sealed into desks/mt5/data/RELEASE.json as TESTED and that manifest is committed
  # ALONE ("seal release <sha>"): the commit's diff against its parent is exactly the manifest,
  # the one shape libs.ops.release.accepts() admits besides the sealed commit itself, so the
  # box's release identity can name the code that actually ran the suite. `--if-needed` makes
  # the job a no-op on its own seal commit and on the box's state-sync commits, so it cannot
  # seal forever. Push only: a PR head is not a release. release_manifest.py is stdlib-only, so
  # no install step.
  seal:
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/desk-sync-clean' ||
        github.ref == 'refs/heads/claude/llm-auto-upgrade-verify-gcjac3')
    needs: [quality, mt5-money-path]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # THE COMMIT `promote` RELEASES: the pure-seal commit this job pushed, or the tested commit
    # itself when it was already sealed or when the branch moved on to code these gates did not
    # run. Never a tip nobody tested.
    outputs:
      release_commit: ${{ steps.push.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Seal the tested release (no-op when HEAD is already the sealed code)
        run: python scripts/release_manifest.py --seal --tested --if-needed --by "ci:${{ github.run_id }}"

      # Three tries. A rejected push means the branch moved under us -- normally by the box's
      # own state-sync or an earlier seal. The tested SHA is re-read from the new tip ONLY when
      # the tip carries no code the gates did not run (its diff against the sealed SHA is
      # confined to desk state); a tip with untested code is left for its own CI run to seal,
      # because `--tested` is an attestation and this job may not make one it did not earn.
      - name: Commit RELEASE.json alone and push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "quant-ci"
          git config user.email "ci@users.noreply.github.com"
          if git diff --quiet -- desks/mt5/data/RELEASE.json; then
            echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "nothing to seal: HEAD is already the sealed code"; exit 0
          fi
          tested="$(git rev-parse HEAD)"
          git add desks/mt5/data/RELEASE.json
          git commit -q -m "seal release $(git rev-parse --short "$tested")"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${BRANCH}"; then
              echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected (attempt ${attempt}): the branch moved -- re-sealing on the new tip"
            git reset -q --hard HEAD~1
            git pull -q --ff-only origin "${BRANCH}"
            if ! git diff --quiet "$tested" HEAD -- . ':(exclude)desks/mt5/data'; then
              echo "::warning::the new tip carries code these gates did not run; leaving the seal to its own CI run"
              echo "release_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tested="$(git rev-parse HEAD)"
            python scripts/release_manifest.py --seal --tested --if-needed --by "ci:${RUN_ID}"
            if git diff --quiet -- desks/mt5/data/RELEASE.json; then
              echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "the new tip is already the sealed code"; exit 0
            fi
            git add desks/mt5/data/RELEASE.json
            git commit -q -m "seal release $(git rev-parse --short "$tested")"
          done
          echo "::error::could not push the seal after 3 attempts"; exit 1

  # DEVELOPMENT -> GREEN IMMUTABLE RELEASE -> PRODUCTION, AND A MASTER EQUAL TO WHAT IS DEPLOYED.
  # Runs only after both gates are green AND the seal job has committed RELEASE.json, on a push to
  # the live branch (a PR head is not a release). `scripts/release_promotion.py promote`
  # (logic in libs/ops/release_promotion.py, tests in tests/ops/test_release_promotion.py):
  #   1. refuses a release commit whose CODE differs from the tested commit, or that is not on
  #      the live branch;
  #   2. creates the annotated tag release/<UTC>-<sha12> carrying this run's id, the law gate's
  #      verdict and both suites' counts -- a tag that exists is never moved;
  #   3. fast-forwards `production` to it (a plain push: a non-fast-forward is REJECTED, and a
  #      production moved off the live history by hand fails this job rather than being forced);
  #   4. syncs master by the tree-take merge of 99704ba1 / PR #66 -- parents (master, release),
  #      tree = release's tree -- pushed without force, rebuilt if master moved.
  # The trading box adopts `production` (Adopt-And-Seal.ps1 -> `release_promotion.py gate`), so
  # the branch tip reaches the money path only once this job has run. Pushes made with the
  # workflow's GITHUB_TOKEN start no workflow run, so this cannot loop.
  # Protect `production` in the repository settings: no force pushes, no deletions.
  promote:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/claude/llm-auto-upgrade-verify-gcjac3'
    needs: [quality, mt5-money-path, seal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag the release, fast-forward production, tree-take master
        env:
          TARGET: ${{ needs.seal.outputs.release_commit }}
          LAW_GATE: ${{ needs.quality.outputs.law_gate }}
          QUALITY_SUITE: ${{ needs.quality.outputs.suite }}
          MT5_SUITE: ${{ needs.mt5-money-path.outputs.suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/release_promotion.py promote
          --target "${TARGET:-$GITHUB_SHA}" --tested "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --run-url "$RUN_URL"
          --law-gate "$LAW_GATE" --quality-suite "$QUALITY_SUITE" --mt5-suite "$MT5_SUITE"
