# TEMPORARY probe for the reviewer pins (removed before this PR leaves draft). Prints the Ollama
# archive sha256, GitHub's own digest for that release asset, and each model's manifest sha256.
# No secrets; read-only token; never reviews or gates anything.
name: pin-probe
on:
  pull_request:
    branches: [claude/llm-auto-upgrade-verify-gcjac3]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.ref == 'claude/release-controller-pins'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops/release
          persist-credentials: false
      - name: Print the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cfg=ops/release/local_models.json
          url=$(python -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$cfg")
          ver=$(python -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["ollama"])' "$cfg")
          gh api "repos/ollama/ollama/releases/tags/v$ver" --jq '.assets[] | select(.name | startswith("ollama-linux-amd64")) | "official asset \(.name) \(.digest) \(.browser_download_url)"' || true
          dir="$RUNNER_TEMP/ollama"; mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ollama.tgz" "$url"
          echo "archive sha256 $(sha256sum "$dir/ollama.tgz" | cut -d' ' -f1)"
          tar -xzf "$dir/ollama.tgz" -C "$dir"
          nohup "$dir/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          for m in $(python -I -c 'import json,sys; print(" ".join(m["name"] for m in json.load(open(sys.argv[1]))["models"]))' "$cfg"); do
            "$dir/bin/ollama" pull "$m" >/dev/null
            repo=${m%%:*}; tag=${m#*:}
            echo "manifest sha256 $m $(sha256sum ~/.ollama/models/manifests/registry.ollama.ai/library/$repo/$tag | cut -d' ' -f1)"
          done
          curl -sf http://127.0.0.1:11434/api/tags | python -I -c 'import json,sys; [print("server digest", m["name"], m["digest"]) for m in json.load(sys.stdin)["models"]]'
