name: trusted-eval
# THE BASE JUDGES CHANGES TO THE CHECKS (ops/release/authority/ONE_TIME_AUTHORISATION.md). A PR that changes
# .github/, ops/release/ or test configuration runs ITS OWN copy of those in `pull_request`, so
# its green is self-attested. `pull_request_target` runs THIS file from the BASE branch, never the
# PR's. It runs the BASE's test configuration and the BASE's suites (ops/release/
# trusted_eval_suites.txt and risk_suites.txt) and the BASE's risk_invariants.py against the PR
# head's code: a head that loosens a gate fails the base tests that pin it.
#
# The run-name names the PR and the exact head it checked out; the gate and the release authority
# accept only a successful run whose run-name is `trusted-eval <pr> <head sha>`.
#
# SAFETY: PR code runs here, in the BASE ref's cache scope, from the moment this file is on LIVE
# (merging it starts this job on every same-repo PR; nothing else in the release authority is on
# until zuck activates it). So this job holds a READ-ONLY token, no secrets, persists no
# credentials and restores no cache, and NO gating workflow restores a cache either (#637 audit
# MF1: `cache: pip` removed from ci.yml and release-gates.yml, so a poisoned base-scope cache
# entry has no reader). Forks never run it. This file is ROOT (ops/release/authority/
# ROOT_POLICY.json): the authority never clears a change to it.
#
# WHAT A GREEN HERE PROVES (#637 audit SF1): that the base's tests pass against an HONEST head.
# A hostile head runs with the runner's sudo and could fake a green (os._exit(0) at import); the
# collected-versus-passed count below catches the cheap version only. Against a hostile author
# the other gates stand: independent review of the diff, the 24 h veto, auto-revert.
run-name: trusted-eval ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["claude/llm-auto-upgrade-verify-gcjac3"]

permissions:
  contents: read

concurrency:
  group: trusted-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-eval:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Put the base's test configuration and suites over the head
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}"
          # every test-config file: the base's copy wins; one only the head has is removed
          pat='(^|/)(conftest\.py|pytest\.ini|tox\.ini|setup\.cfg|setup\.py|pyproject\.toml|sitecustomize\.py|usercustomize\.py)$|\.pth$'
          git ls-tree -r --name-only HEAD | grep -E "$pat" | while read -r f; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then git checkout "$BASE" -- "$f"; else git rm -q -f -- "$f"; fi
          done
          git ls-tree -r --name-only "$BASE" | grep -E "$pat" | xargs -r git checkout "$BASE" --
          # the base's suite lists, and the base's copy of every test file they name
          mkdir -p "$RUNNER_TEMP/trusted"
          for list in ops/release/trusted_eval_suites.txt ops/release/risk_suites.txt; do
            git show "$BASE:$list" 2>/dev/null | grep -v -e '^#' -e '^$' >> "$RUNNER_TEMP/trusted/suites" || true
          done
          sort -u -o "$RUNNER_TEMP/trusted/suites" "$RUNNER_TEMP/trusted/suites"
          while read -r t; do
            if git cat-file -e "$BASE:$t" 2>/dev/null; then git checkout "$BASE" -- "$t"; fi
          done < "$RUNNER_TEMP/trusted/suites"
          # the base's whole release harness, apart from the tree (risk_invariants loads its
          # siblings from its own folder)
          git archive "$BASE" ops/release | tar -x -C "$RUNNER_TEMP/trusted"
          wc -l "$RUNNER_TEMP/trusted/suites"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (the base's pinned dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: The base's ceilings and rail lists against the head
        run: >-
          python -I "$RUNNER_TEMP/trusted/ops/release/risk_invariants.py"
          --ceilings "$RUNNER_TEMP/trusted/ops/release/ceilings.json"
          --head "${{ github.event.pull_request.head.sha }}"
          --base "${{ github.event.pull_request.base.sha }}"

      - name: The base's suites against the head's code
        run: |
          set -euo pipefail
          present=()
          while read -r t; do [ -e "$t" ] && present+=("$t"); done < "$RUNNER_TEMP/trusted/suites"
          want=$(pytest -q --co -p no:randomly -p no:cacheprovider "${present[@]}" | grep -c '::' || true)
          pytest -q -p no:randomly -p no:cacheprovider --timeout=600 \
            --junitxml "$RUNNER_TEMP/trusted/junit.xml" "${present[@]}"
          # every collected base test must have RUN: an early exit 0 is not a pass
          python -I - "$RUNNER_TEMP/trusted/junit.xml" "$want" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          ran = sum(int(s.get("tests", 0)) for s in suites)
          bad = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          want = int(sys.argv[2])
          print(f"trusted-eval: {ran} run, {bad} failed, {want} collected")
          sys.exit(0 if want > 0 and ran >= want and bad == 0 else 1)
          PY
