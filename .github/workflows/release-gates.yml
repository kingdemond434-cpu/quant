name: release-gates

# The AUTO-tier jobs of the release controller (.github/scripts/audit_gate.py). An AUTO-tier PR
# merges with no comment only when these succeed on its head, beside the ci.yml gating jobs and
# the box's replay-shadow verdict. Every other PR ignores them: the CLEAR + APPROVE MERGES path
# never reads these jobs, so a failure here never blocks a change zuck approves himself.
#
# An AUTO-tier PR cannot change this file or ops/release/ (both PROTECTED), so on such a PR the
# copies that run are the base's. The tests and ceilings are taken from the base again anyway.

on:
  pull_request:
    branches: ["claude/llm-auto-upgrade-verify-gcjac3"]

permissions:
  contents: read
  pull-requests: read

jobs:
  risk-invariants:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the ceilings, suites and their tests from the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE" -- ops/release
          grep -v -e '^#' -e '^$' ops/release/risk_suites.txt > "$RUNNER_TEMP/suites"
          xargs -a "$RUNNER_TEMP/suites" git checkout "$BASE" --

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ceilings and rail lists (static, from git)
        run: >-
          python -I ops/release/risk_invariants.py
          --head "${{ github.event.pull_request.head.sha }}"
          --base "${{ github.event.pull_request.base.sha }}"

      - name: Risk suites (base tests, PR code)
        run: xargs -a "$RUNNER_TEMP/suites" pytest -q -p no:randomly -p no:cacheprovider --timeout=600

  independent-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: independent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the base only: the PR's code never runs in the job that holds the reviewer's key
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: ops/release
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the reviewer client
        run: python -m pip install "anthropic==2.3.0"

      - name: Review the whole diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REVIEWER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -I ops/release/independent_review.py
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --head "${{ github.event.pull_request.head.sha }}"
