name: release-gates

# The AUTO-tier jobs of the release controller (.github/scripts/audit_gate.py). An AUTO-tier PR
# merges with no comment only when these succeed on its head, beside the ci.yml gating jobs.
# Every other PR ignores them: the CLEAR + APPROVE MERGES path never reads these jobs, so a
# failure here never blocks a change zuck approves himself.
#
# ZERO API COST (zuck 2026-10-28 19:47Z): Actions is free on standard runners for this public
# repo, and the reviewer is open-weight models on the runner itself: no key, no paid call.
#
# An AUTO-tier PR cannot change this file or ops/release/ (both PROTECTED), so on such a PR the
# copies that run are the base's. The tests and ceilings are taken from the base again anyway.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["claude/llm-auto-upgrade-verify-gcjac3"]

# A new head supersedes the old head's run, queued or running: only the head's checks count.
# MEASURED 2026-10-29: with no group here, runs for heads already replaced still queued for the
# free runner pool (8 of them, beside 189 current runs), each with a reviewer job of 20-100 min.
concurrency:
  group: release-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # THE FAST LANE (zuck 2026-11-17: "strip all checks of anything that doesn't touch live money ...
  # forever"). The base's .github/scripts/fast_lane.py reads the PR's paths against the BASE's
  # money closure (never the PR's code). On a fast PR every step of the heavy jobs below is
  # skipped and the job reports under a "(fast lane: not run)" name, so the gate can never read it
  # as the real check; `smoke` is the one job such a PR needs. A push, a dispatch, any read error,
  # or a base without the classifier is never fast.
  lane:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fast: ${{ steps.lane.outputs.fast }}
    steps:
      - name: The base (the classifier and the money closure come from it, never from the PR)
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fast lane? (no money path, no release or box machinery, no check)
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          no() { echo "fast=false" >> "$GITHUB_OUTPUT"; echo "not fast: $1"; exit 0; }
          case "$EVENT" in pull_request|pull_request_target) ;; *) no "$EVENT run" ;; esac
          [ "$SAME_REPO" = true ] || no "a fork"
          # A DRAFT runs the smoke check only. 500+ open drafts each ran the ~40 min suite,
          # the release gates and trusted-eval on every push, and that queue (301 runs,
          # 2026-11-17) is what starved the PRs that were ready. Marking it ready fires
          # ready_for_review, which re-runs this lane and the full checks on the same head;
          # nothing merges a draft, and a skipped check carries the "(... not run)" name.
          # The draft state is read LIVE, never from the event: when the gate marks a CLEARed
          # draft ready with its own token (which starts no run) it RE-RUNS these runs, and a
          # re-run carries the old payload (#1240 audit MF1). Unreadable reads as not a draft,
          # so the full checks run rather than wait.
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft 2>/dev/null || echo false)
          if [ "$DRAFT" = true ]; then
            echo "fast=true" >> "$GITHUB_OUTPUT"; echo "a draft: full checks wait for ready"; exit 0
          fi
          [ -f .github/scripts/fast_lane.py ] || no "the base has no classifier"
          git fetch -q --no-tags origin "$HEAD" || no "the head could not be fetched"
          python -I .github/scripts/fast_lane.py --base "$BASE" --head "$HEAD" \
            --github-output "$GITHUB_OUTPUT" || no "the classifier failed"

  risk-invariants:
    name: "${{ needs.lane.outputs.fast == 'true' && 'risk-invariants (fast lane: not run)' || 'risk-invariants' }}"
    needs: [lane]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        if: needs.lane.outputs.fast != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the ceilings, suites and their tests from the base
        if: needs.lane.outputs.fast != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE" -- ops/release
          grep -v -e '^#' -e '^$' ops/release/risk_suites.txt > "$RUNNER_TEMP/suites"
          xargs -a "$RUNNER_TEMP/suites" git checkout "$BASE" --

      - uses: actions/setup-python@v5
        if: needs.lane.outputs.fast != 'true'
        with:
          python-version: "3.11"
          # no `cache: pip` (#637 audit MF1): trusted-eval runs PR code under pull_request_target in
          # the base's cache scope, so a base-scope pip cache could be poisoned for these gating jobs

      - name: Install (pinned dev extras)
        if: needs.lane.outputs.fast != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ceilings and rail lists (static, from git)
        if: needs.lane.outputs.fast != 'true'
        run: >-
          python -I ops/release/risk_invariants.py
          --head "${{ github.event.pull_request.head.sha }}"
          --base "${{ github.event.pull_request.base.sha }}"

      - name: Risk suites (base tests, PR code)
        if: needs.lane.outputs.fast != 'true'
        run: xargs -a "$RUNNER_TEMP/suites" pytest -q -p no:randomly -p no:cacheprovider --timeout=600

  replay-shadow:
    name: "${{ needs.lane.outputs.fast == 'true' && 'replay-shadow (fast lane: not run)' || 'replay-shadow' }}"
    needs: [lane]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The harness is the base's, in a directory the PR's tree never touches.
      - uses: actions/checkout@v4
        if: needs.lane.outputs.fast != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: harness
          sparse-checkout: ops/release
          persist-credentials: false

      # Each tree holds on disk only what the live book imports and reads (code, books, state).
      - uses: actions/checkout@v4
        if: needs.lane.outputs.fast != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          # blobless: the money-path closure and the knob check read any file through git
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libs/
            /desks/mt5/mt5desk/
            /desks/mt5/prop/
            /desks/mt5/*.py
            /desks/mt5/data/*.json
            /desks/mt5/reports/*.json
            /data/*.json
            # the FTMO lane's admission gate (prop/ftmo_executor, e8_executor import it from research/)
            /desks/mt5/research/admission_integrity.py
            # the research-input leg (replay_child.research_step): orthogonal_sweep, pf_allocator
            # and what they import from research/
            /desks/mt5/research/*.py
            /pyproject.toml
          persist-credentials: false

      - uses: actions/checkout@v4
        if: needs.lane.outputs.fast != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libs/
            /desks/mt5/mt5desk/
            /desks/mt5/prop/
            /desks/mt5/*.py
            /desks/mt5/data/*.json
            /desks/mt5/reports/*.json
            /data/*.json
            # the FTMO lane's admission gate (prop/ftmo_executor, e8_executor import it from research/)
            /desks/mt5/research/admission_integrity.py
            # the research-input leg (replay_child.research_step): orthogonal_sweep, pf_allocator
            # and what they import from research/
            /desks/mt5/research/*.py
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: needs.lane.outputs.fast != 'true'
        with:
          python-version: "3.11"
          # no `cache: pip` (#637 audit MF1): trusted-eval runs PR code under pull_request_target in
          # the base's cache scope, so a base-scope pip cache could be poisoned for these gating jobs

      # The base's declared dependencies only, never the project itself: an installed copy of
      # either tree would answer imports the other tree is missing.
      - name: Install the base's dependencies
        if: needs.lane.outputs.fast != 'true'
        working-directory: base
        run: |
          python -m pip install --upgrade pip
          python - > "$RUNNER_TEMP/deps.txt" <<'PY'
          import tomllib
          print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]))
          PY
          pip install -r "$RUNNER_TEMP/deps.txt"

      # Every changed path, both sides of a rename, from the PR's paginated file list (the
      # compare API stops at 300 files). The count must match the PR's own, on this very head.
      - name: The PR's changed paths
        if: needs.lane.outputs.fast != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/pulls/$PR"
          gh api "$api/files?per_page=100" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          gh api "$api/files?per_page=100" --paginate \
            --jq '.[] | .previous_filename // empty' > "$RUNNER_TEMP/previous.txt"
          now=$(gh api "$api" --jq '.head.sha')
          want=$(gh api "$api" --jq '.changed_files')
          got=$(wc -l < "$RUNNER_TEMP/files.txt")
          if [ "$now" != "$HEAD_SHA" ]; then
            echo "::error::the head moved while its files were read; the new head gets its own run"
            exit 1
          fi
          if [ "$got" -ne "$want" ]; then
            echo "::error::the file list names $got files, the PR changes $want"
            exit 1
          fi
          sort -u "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/previous.txt" > "$RUNNER_TEMP/changed.txt"

      # The Auditor's declared Fusion-roster divergences, from the BASE (harness) only: a PR can
      # never declare its own. A match is MATCHES_DECLARED, which still exits 1 here.
      - name: Replay the live E8 book, base against PR
        if: needs.lane.outputs.fast != 'true'
        env:
          QUANT_EXPECTED_DIVERGENCE: harness/ops/release/expected_divergence.json
        run: >-
          python -I harness/ops/release/replay_shadow.py --base base --head head
          --changed "$RUNNER_TEMP/changed.txt" --report "$RUNNER_TEMP/replay_shadow.json"

      # The report, for the release authority: it re-reads a MATCHES_DECLARED from here, re-matches
      # it against the base's registry itself, and maps it to CONTROLLER (policy.declared_replay).
      - name: Keep the replay report
        if: ${{ needs.lane.outputs.fast != 'true' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: replay-shadow-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/replay_shadow.json
          if-no-files-found: ignore
          retention-days: 14

  independent-review:
    name: "${{ needs.lane.outputs.fast == 'true' && 'independent-review (fast lane: not run)' || 'independent-review' }}"
    needs: [lane]
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Free and keyless (ops/release/independent_review.py): open-weight models run on this runner
    # under a sha256-pinned Ollama, each asked only when its manifest matches the pin in
    # ops/release/local_models.json. No key, no account, no paid call. The two optional key rungs
    # are used only if such a secret ever exists; none is asked for. No pinned model served, or none answering in time, ends
    # UNAVAILABLE (exit 75): the controller queues the PR and re-runs this job.
    concurrency:
      group: independent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      # the base only: the PR's code never runs in the reviewer's job. LIVE'S TIP, NOT THE EVENT'S
      # BASE SHA, for a PR into LIVE (2026-11-03): a re-run replays the original event, so with
      # base.sha every re-queued review (audit_gate.requeue) ran the reviewer as it was when the
      # PR last moved -- #474's re-runs kept asking llama3.1:8b and two votes hours after #579
      # unpinned it, and timed out each time. LIVE is protected, so its tip is as trusted as any
      # base sha; any other base keeps its exact sha.
      - uses: actions/checkout@v4
        if: needs.lane.outputs.fast != 'true'
        with:
          ref: >-
            ${{ github.event.pull_request.base.ref == 'claude/llm-auto-upgrade-verify-gcjac3'
            && github.event.pull_request.base.ref || github.event.pull_request.base.sha }}
          sparse-checkout: ops/release
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: needs.lane.outputs.fast != 'true'
        with:
          python-version: "3.11"

      # A failure here is not a verdict: the review below finds no pinned model and queues.
      # #457 audit MF1: no install script and no sudo. The release archive runs only when its
      # sha256 matches the PROTECTED pin, and the server runs as the runner user.
      - name: Serve the pinned open-weight reviewers on this runner
        if: needs.lane.outputs.fast != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          OLLAMA_MAX_LOADED_MODELS: "1"
          OLLAMA_NUM_PARALLEL: "1"
        run: |
          cfg=ops/release/local_models.json
          pin() { python -I -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; print(v or "")' "$cfg" "$1"; }
          dir="$RUNNER_TEMP/ollama"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ollama.tgz" "$(pin archive)"
          got=$(sha256sum "$dir/ollama.tgz" | cut -d' ' -f1)
          echo "archive sha256 $got"
          want=$(pin archive_sha256)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::warning::the Ollama archive does not match its pin ($want); nothing is run"
            exit 1
          fi
          tar -xzf "$dir/ollama.tgz" -C "$dir"
          nohup "$dir/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          for m in $(python -I -c 'import json,sys; print(" ".join(m["name"] for m in json.load(open(sys.argv[1]))["models"]))' "$cfg"); do
            "$dir/bin/ollama" pull "$m"
            repo=${m%%:*}; tag=${m#*:}
            echo "manifest sha256 $m $(sha256sum ~/.ollama/models/manifests/registry.ollama.ai/library/$repo/$tag | cut -d' ' -f1)"
          done

      - name: Review the whole diff
        if: needs.lane.outputs.fast != 'true'
        env:
          OPENROUTER_FREE_KEY: ${{ secrets.OPENROUTER_FREE_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -I ops/release/independent_review.py
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
