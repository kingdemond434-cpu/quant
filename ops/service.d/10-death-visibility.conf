# Global user-scope service drop-in (gap-fixer 2026-08-26).
# INSTALL PATH: ~/.config/systemd/user/service.d/10-death-visibility.conf
# Applies to EVERY user service (current and future -- no per-unit list, anti-hardcode law).
# On any non-success stop (oom-kill, timeout, core-dump, exit-nonzero) the logger appends one
# JSON line to data/cro_ai_logs/unit_deaths.jsonl; success stops log nothing.
# Consumer: scripts/max_audit.py check "unit-deaths" (defect on deaths in the last 24h).
# Why: 2026-08-26 -- three gap-wirer seats OOM-killed in one night, each leaving a 58-byte
# log identical to an auth failure; the desk once lost 4 days to exactly this silence class.
[Service]
ExecStopPost=/bin/bash /home/quant/quant-platform/scripts/unit_death_log.sh %n
