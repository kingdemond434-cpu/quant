<style>
/* Layout copied from the approved mockup: top bar, 168px left nav, KPI strip, hero + pipeline, flow + health, log + accounts. */
:root{
  --bg:#09090f; --panel:#101015; --panel2:#17171e; --rule:rgba(255,255,255,.055); --edge:rgba(255,255,255,.055); --fg:#ededf2; --muted:#9a9aa8; --dim:#6b6b7a;
  --accent:#9333ea; --accent-soft:rgba(147,51,234,.16); --good:#6ee787; --bad:#f87171; --warn:#e5b25d;
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45;margin:0;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.shell{max-width:1320px;margin:0 auto}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.na{color:var(--dim);font-family:var(--mono);font-size:.85em;letter-spacing:.02em}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)} .acc{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top bar */
.top{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px}
.brand img{height:26px;width:auto;display:block;align-self:flex-start}
.tagline{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.top .sep{width:1px;height:30px;background:var(--rule)}
.top .name{font-size:12.5px;letter-spacing:.24em;font-weight:500;color:var(--fg)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--fg);font-size:12px;font-family:var(--mono);letter-spacing:.04em}
.top .right .sep{height:22px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status.ok{color:var(--good)} .status.ok i{background:var(--good);animation:blink 2.4s ease-in-out infinite}
.status.warn{color:var(--warn)} .status.warn i{background:var(--warn)}
.status.bad{color:var(--bad)} .status.bad i{background:var(--bad)}
@keyframes blink{50%{opacity:.4}}
/* body */
.body{display:grid;grid-template-columns:168px minmax(0,1fr);gap:0}
nav{display:flex;flex-direction:column;gap:4px;padding:16px 14px 16px 0;border-right:1px solid var(--rule);background:linear-gradient(180deg,transparent 55%,rgba(147,51,234,.1));min-height:560px}
nav a{display:flex;align-items:center;gap:13px;padding:10px 13px;border:1px solid transparent;border-radius:9px;color:#b9b9c6;text-decoration:none;font-size:13.5px}

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var NA='<span class="na">UNMEASURED</span>';
var DOT='·',DASH='—';
var feed=null,lastBuilt=null,feedFrom='none',repRead=0,lastRep=null,tweens={},mem={},firstSeen={};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var f0=function(n){return n==null||isNaN(n)?null:Math.round(n).toLocaleString('en-US')};
var usd=function(n,d){return n==null||isNaN(n)?null:'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})};
var sgn=function(n,d){if(n==null||isNaN(n))return null;return (n>0?'+':n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})};
var T=function(s){var t=s?Date.parse(s):NaN;return isNaN(t)?null:t};
function ageS(iso){var t=T(iso);return t==null?null:(Date.now()-t)/1000}
function ago(iso){var s=ageS(iso);if(s==null)return null;s=Math.max(0,Math.round(s));
  if(s<90)return s+'s';if(s<5400)return Math.round(s/60)+'m';if(s<172800)return (s/3600).toFixed(1)+'h';return (s/86400).toFixed(1)+'d'}
var hhmm=function(iso){return iso?iso.slice(11,16)+'Z':''};

/* freshness tags: label and colour are rewritten every second from the section's own timestamp */
function tagClass(iso,ex){var a=ageS(iso);if(a==null)return '';return a<=ex*1.5?'ok':a<=ex*6?'warn':'bad'}
function tag(iso,ex){if(!iso)return '<span class="pill">no timestamp</span>';
  return '<span class="pill '+tagClass(iso,ex)+'" data-ts="'+esc(iso)+'" data-ex="'+ex+'">as of '+hhmm(iso)+' '+DOT+' '+ago(iso)+' ago</span>'}
function tickTags(){document.querySelectorAll('[data-ts]').forEach(function(el){var iso=el.getAttribute('data-ts'),ex=+el.getAttribute('data-ex');
  el.className='pill '+tagClass(iso,ex);el.textContent='as of '+hhmm(iso)+' '+DOT+' '+ago(iso)+' ago'})}
var EX={acct:300,hour:3900};
function acctAsOf(){var a=(feed&&feed.accounts)||{};return Object.keys(a).map(function(k){return a[k].as_of}).filter(Boolean).sort().pop()||null}

/* history for sparklines (kept in this browser; dashed until two readings exist) */
function hist(k){if(mem[k])return mem[k];var h=[];try{h=JSON.parse(localStorage.getItem('qd_'+k)||'[]')}catch(e){}mem[k]=h;return h}
function record(f){
  var a=f.accounts||{},sc=f.scorecard||{},st={};((f.pipeline||{}).stages||[]).forEach(function(s){st[s.stage]=s.cells});
  var vals={eqF:a.FTMO&&a.FTMO.equity,eqE:a.E8&&a.E8.equity,eqM:f.memecoin&&f.memecoin.equity,backlog:(f.pipeline||{}).unjudged_backlog,clocks:st['forward clocks'],cand:st['promotion candidates'],live:st['LIVE sleeves'],rulesE:sc.rules_enforced,labsF:sc.labs&&sc.labs.fresh,roomE:a.E8&&a.E8.room_daily,mined:st['mined cells'],judged:st['judged (verdicts)'],cert:st['certified (ten-gate)'],broken:sc.rules_violated},now=Date.now();
  Object.keys(vals).forEach(function(k){var v=vals[k];if(v==null)return;var h=hist(k),l=h[h.length-1];if(l&&l[1]===v&&now-l[0]<1800000)return;h.push([now,v]);if(h.length>160)h.splice(0,h.length-160);try{localStorage.setItem('qd_'+k,JSON.stringify(h))}catch(e){}})}
function spark(k){
  var h=hist(k),w=60,ht=28,n=h.length;
  if(n<2)return '<svg class="spark" viewBox="0 0 '+w+' '+ht+'" aria-label="history building"><line x1="0" y1="'+(ht-4)+'" x2="'+w+'" y2="'+(ht-4)+'" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="2 4"/></svg>';
  var vs=h.map(function(p){return p[1]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),rg=(mx-mn)||1;
  var xy=h.map(function(p,i){return [i/(n-1)*w,ht-4-((p[1]-mn)/rg)*(ht-9)]}),pts=xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' '),last=xy[n-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+ht+'" aria-label="history"><defs><linearGradient id="g'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9333ea" stop-opacity=".35"/><stop offset="1" stop-color="#9333ea" stop-opacity="0"/></linearGradient></defs><polygon points="0,'+ht+' '+pts+' '+w+','+ht+'" fill="url(#g'+k+')"/><polyline points="'+pts+'" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linejoin="round"/></svg>'}
function sparkBars(k){
  var h=hist(k).slice(-8),n=h.length,w=60,ht=28,bw=5,gap=2.6,out='';
  if(n<2){for(var i=0;i<7;i++)out+='<rect x="'+(i*(bw+gap)).toFixed(1)+'" y="'+(ht-3)+'" width="'+bw+'" height="3" rx="1" fill="var(--dim)" opacity=".5"/>';return '<svg class="spark" viewBox="0 0 '+w+' '+ht+'" aria-label="history building">'+out+'</svg>'}
  var vs=h.map(function(p){return p[1]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),rg=(mx-mn)||1;
  vs.forEach(function(v,i){var bh=3+((v-mn)/rg)*(ht-6);out+='<rect x="'+(i*(bw+gap)).toFixed(1)+'" y="'+(ht-bh).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="1" fill="#a855f7" opacity="'+(0.45+0.55*(i+1)/n).toFixed(2)+'"/>'});
  return '<svg class="spark" viewBox="0 0 '+w+' '+ht+'" aria-label="history">'+out+'</svg>'}

/* win rate and profit factor from closed trades */
function stats(tr){var n=tr.length;if(!n)return {n:0};var w=0,gw=0,gl=0,net=0;tr.forEach(function(x){var p=Number(x.pnl)||0;net+=p;if(p>0){w++;gw+=p}else if(p<0)gl+=-p});return {n:n,wr:w/n,pf:gl>0?gw/gl:(gw>0?Infinity:null),net:net}}
function wrTxt(s){return s.n?(s.wr*100).toFixed(0)+'% ('+s.n+')':NA}
function pfTxt(s){return !s.n?NA:(s.pf==null?DASH:(s.pf===Infinity?'∞':s.pf.toFixed(2)))}
function tradesFor(p){return (feed&&feed.trades||[]).filter(p)}

function countUp(){
