# 24/7 autonomous research: supervisor (workers) + dashboard API, both auto-restarting.
# Usage:  docker compose up -d   then open http://localhost:8000/docs
services:
  supervisor:
    build: .
    restart: always                       # OS-level resurrection of the supervisor itself
    command: >
      python scripts/run_supervisor.py
      --workers 3 --db data/sor_research.sqlite --lake data/lake --min-queue-depth 12
    volumes:
      - ./data:/app/data                  # SoR DB + Parquet lake persist across restarts
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "3.0"                     # CPU throttling
          memory: 6g                      # memory limit (OOM-kill a runaway; supervisor recovers)

  dashboard-api:
    build: .
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro               # read-only: the dashboard never writes
      - ./reports:/app/reports:ro
    depends_on:
      - supervisor
