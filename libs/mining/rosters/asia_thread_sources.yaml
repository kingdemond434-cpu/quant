  # alt_proxies
  - id: kr_exports_early
    name: Korea Customs Service 1-10 / 1-20 day exports
    url: https://www.customs.go.kr/kcs/na/ntt/selectNttList.do
    region: KR
    language: ko
    cadence: 10-daily
    auth: none
    licence: Korea Customs Service public press releases (KOGL public-sector open licence, attribution);
      no login, no key
    cursor: vintage store keyed series|period (append-only)
    pit: available_time = page publication stamp else release-calendar rule (late-biased); first_seen_at
      = vault fetch instant
    uses:
    - direct_cells
    - indirect_cells
    - allocation_intel
    consumer: desks/mt5/research/alt_proxies.py
    status: UNMEASURED_LIVE_YIELD
    mechanism: Korea's customs office prints exports for the first 10 and 20 days of the month, weeks before
      any other country's monthly trade figure; semiconductor exports are the global chip cycle read at
      the dock
    payer: slow repricers of Asian trade and chip-cycle risk who wait for the monthly MOTIE/customs totals
      and the chipmakers' own guidance
    constraint: institutional FX and equity books rebalance on month-end official data and earnings calendars,
      not on a partial-month Korean press release
    source_culture: KR/ko
    participant_structure:
    - institutional
    - physical_flow
    failure_mode_hypothesis: fails when working-day and holiday shifts (Chuseok, Lunar New Year) distort
      a partial month, which does not coincide with US data-surprise regimes
    crowding_prior: medium
