# Sources built by thread "Asian quant practices gap check", for the "MT5 global mining pipeline v1" roster (sources.yaml).
# One row per source; fields: id, name, url, region, language, cadence, auth, licence, cursor, pit, uses, consumer, status.
# Live yield is UNMEASURED until the trading box runs them (the cloud container cannot reach these hosts).
sources:
# alpha_capture
  - id: yahoo_upgrades
    name: Yahoo Finance upgrade/downgrade history
    url: https://query2.finance.yahoo.com/v10/finance/quoteSummary/{ticker}?modules=upgradeDowngradeHistory
    region: US
    language: en
    cadence: 60m
    auth: cookie
    licence: 'Yahoo terms: personal/non-commercial display of public quote data; a session cookie + crumb
      (no login) is required; per-host 1.1s spacing'
    cursor: round-robin over the 103 tickers (35 per pass); dedupe by event_id (ticker|firm|epochGradeDate|toGrade|fromGrade)
    pit: published_at = epochGradeDate (date precision when it is a UTC midnight); first_seen_at = this
      pass's clock
    uses:
    - direct_cells
    - indirect_cells
    - allocation_intel
    consumer: desks/mt5/research/alpha_capture.py
    status: UNMEASURED_LIVE_YIELD
    source_culture: US/en
    participant_structure:
    - institutional
    - broker_specific
    failure_mode_hypothesis: 'the most arbitraged version of revision drift: it should fail when US attention
      is saturated (earnings season, mega-cap coverage) and revision-momentum quant books are crowded, not
      on Asian policy or flow calendars'
    crowding_prior: high
  - id: sec_8k_guidance
    name: SEC EDGAR 8-K full-text search for guidance changes
    url: https://efts.sec.gov/LATEST/search-index?q=%22raises%20guidance%22&forms=8-K
    region: US
    language: en
    cadence: 360m
    auth: none
    licence: US federal public record; SEC fair access (<=10 req/s) with a declared User-Agent from QUANT_EDGAR_UA
      -- unconfigured means not fetched
    cursor: dateRange startdt = last pass minus 3 days; dedupe by accession (adsh)
    pit: published_at = file_date (date precision); first_seen_at = this pass's clock
    uses:
    - direct_cells
    - indirect_cells
    - allocation_intel
    consumer: desks/mt5/research/alpha_capture.py
    status: UNMEASURED_LIVE_YIELD
    source_culture: US/en
    participant_structure:
    - institutional
    failure_mode_hypothesis: company guidance language is machine-read by every headline vendor within seconds;
      it should fail whenever news-parsing algos are active and survive only in thinly covered names, on
      the US disclosure calendar
    crowding_prior: high
  - id: eastmoney_reports
    name: eastmoney research report list (stock and industry)
    url: https://reportapi.eastmoney.com/report/list
    region: CN
    language: zh
    cadence: 60m
    auth: none
    licence: public list API behind data.eastmoney.com/report; no key; list metadata only (the PDFs are
      not fetched); polite spacing
    cursor: beginTime = last pass minus 3 days, pages until an empty page (<= 3 per qType); dedupe by infoCode
    pit: published_at = publishDate in CST (date precision when 00:00:00); first_seen_at = this pass's clock
    uses:
    - direct_cells
    - indirect_cells
    - allocation_intel
    consumer: desks/mt5/research/alpha_capture.py
    status: UNMEASURED_LIVE_YIELD
    source_culture: CN/zh
    participant_structure:
    - retail_heavy
    - policy_driven
    - broker_specific
    failure_mode_hypothesis: A-share sell-side ratings are structurally optimistic and retail-read, so the
      information is in the rare downgrade and the target move; it should fail around policy shifts (state-fund
      support, CSRC windows, Golden Week) rather than at US earnings-season crowding
    crowding_prior: low
  - id: naver_research
    name: Naver Finance research (company, industry, economy lists)
    url: https://finance.naver.com/research/company_list.naver
    region: KR
    language: ko
    cadence: 60m
    auth: none
    licence: public research index pages; broker PDFs are not fetched; target and opinion read from the
      public detail page; polite spacing
    cursor: list pages until a seen nid (<= 3 pages); detail pages for up to 40 new company nids per pass,
      the rest queued in collector_state
    pit: published_at = list date yy.mm.dd (date precision, KST); first_seen_at = this pass's clock; the
      previous target comes from the same broker's earlier row
    uses:
    - direct_cells
    - indirect_cells
    - allocation_intel
    consumer: desks/mt5/research/alpha_capture.py
    status: UNMEASURED_LIVE_YIELD
    source_culture: KR/ko
    participant_structure:
    - retail_heavy
    - broker_specific
    - institutional
    failure_mode_hypothesis: Korean brokers rate almost everything Buy, so the signal is the target change;
      it should fail when foreign flow (MSCI rebalances, won funding stress, export data) dominates the
      tape, not when US attention does
    crowding_prior: low
  - id: tdnet_revisions
    name: TDnet timely disclosures (forecast and dividend revisions) via yanoshin
    url: https://webapi.yanoshin.jp/webapi/tdnet/list/recent.json?limit=300
    region: JP
    language: ja
    cadence: 60m
    auth: none
    licence: public exchange disclosures mirrored by a keyless community API; titles only (PDFs not fetched);
      polite spacing
    cursor: the recent list each pass; dedupe by the mirror's id
    pit: published_at = pubdate JST -> UTC (datetime precision); first_seen_at = this pass's clock
    uses:
    - direct_cells
    - indirect_cells
    - allocation_intel
    consumer: desks/mt5/research/alpha_capture.py
    status: UNMEASURED_LIVE_YIELD
    source_culture: JP/ja
    participant_structure:
    - institutional
    - policy_driven
    failure_mode_hypothesis: Japanese guidance is conservative by custom and revised up through the year,
      so the drift should fail at fiscal-year-end and when the BoJ/yen regime reprices exporters -- a calendar
      that differs from the US guidance cycle
    crowding_prior: low
